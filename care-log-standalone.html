  async set(key, value) {

function bufToB64(buf) {

}

  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBuf(saltB64), iterations, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]

}
async function encryptJSON(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv: bufToB64(iv), ciphertext: bufToB64(ciphertext) };

  const iv = new Uint8Array(b64ToBuf(ivB64));

  return JSON.parse(new TextDecoder().decode(plainBuf));

function groupMedsByDisplayTime(sortedMeds) {
  const groups = [];

    const label = fmtTime(m.timestamp);
    const last = groups[groups.length - 1];

  const key = (name || "").trim().toLowerCase();

// ---------- Lightweight sparkline (no chart library — fast load) ----------
function Sparkline({ points, kind, unitSystem, scaleMax, meds, treatments, flaggedPeriods, domain, onViewChange }) {
  const svgRef = useRef(null);

  const [showMedMarkers, setShowMedMarkers] = useState(true);

  const chartLeft = 34; // reserve space for axis labels
  const plotWidth = width - chartLeft;

    return <div style={{ fontSize: 12, color: inkSoft, padding: "18px 0" }}>No readings yet</div>;
  }
  const display = kind === "temperature" ? points.map((p) => ({ t: p.t, v: displayTemp(p.v, unitSystem) })) : points;
  let minY, maxY;
  if (kind === "temperature") {
    minY = unitSystem === "imperial" ? 95 : 35;
    maxY = unitSystem === "imperial" ? 106 : 41;
  } else if (kind === "number") {
    // No fixed range for a general numeric tracker (unlike severity's fixed 0-max) —
    // scale to the actual logged values, with padding so the line isn't pinned to the edges.
    const vals = points.map((p) => p.v);
    const dataMin = Math.min(...vals);
    const dataMax = Math.max(...vals);
    const rangePad = Math.max((dataMax - dataMin) * 0.15, 1);
    minY = dataMin - rangePad;
    maxY = dataMax + rangePad;
  } else {
    minY = 0;
    maxY = scaleMax || 5;
  }
  const feverLine = kind === "temperature" ? displayTemp(FEVER_C, unitSystem) : null;
  const unit = kind === "temperature" ? tempUnitLabel(unitSystem) : "";
  const xs = display.map((p) => p.t);
  // Prefer the shared domain (same timeline across every tracker + med chart) — fall
  // back to this chart's own data only if no shared domain was supplied.
  const minX = domain ? domain.minX : Math.min(...xs);
  const maxX = domain ? domain.maxX : Math.max(...xs);
  const scaleX = (t) => ((t - minX) / (maxX - minX || 1)) * (plotWidth - pad * 2) + pad + chartLeft;
  const scaleY = (v) => height - pad - ((v - minY) / (maxY - minY)) * (height - pad * 2);
  const d = display.map((p, i) => `${i === 0 ? "M" : "L"} ${scaleX(p.t).toFixed(1)} ${scaleY(p.v).toFixed(1)}`).join(" ");
  const last = display[display.length - 1];
  const axisLabelStyle = { fontSize: 9, fill: inkSoft, fontFamily: "-apple-system, sans-serif" };
  const span = maxX - minX;

  // Flagged periods (relapses, flares, etc.) that overlap this chart's visible range,
  // rendered as a shaded background band spanning their date range. An open-ended
  // period (no end date yet) is drawn out to the right edge of the visible chart.
  const flaggedPeriodBands = (flaggedPeriods || [])
    .map((p) => {
      const startT = new Date(p.startDate + "T00:00:00").getTime();
      const endT = p.endDate ? new Date(p.endDate + "T23:59:59").getTime() : maxX;
      return { ...p, startT, endT };
    })
    .filter((p) => p.endT >= minX && p.startT <= maxX)
    .map((p) => ({
      ...p,
      x1: scaleX(Math.max(p.startT, minX)),
      x2: scaleX(Math.min(p.endT, maxX)),
    }));

    const dt = new Date(t);

      : dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });

  // ---------- Pinch-to-zoom / drag-to-pan ----------
  // Uses refs (not state) to track an in-progress gesture so intermediate touchmove
  // events don't each trigger a full re-render — only the resulting domain change does,

        startDist: touchDistance(t0, t1),
        centerClientX: (t0.clientX + t1.clientX) / 2,

  const medSpan = Math.max(maxX - minX, 1);

  const medsInRange = [

    ...(treatments || []).map((t) => ({ ...t, itemKind: "treatment" })),

    .map((m) => ({ ...m, t: new Date(m.timestamp).getTime() }))
    .filter((m) => m.t >= minX - medPad && m.t <= maxX + medPad)
    .sort((a, b) => a.t - b.t);

  const chartMedGroups = groupMedsByDisplayTime(medsInRange).map((g) => ({

  // temperature/value range — this keeps them visually distinct from real data
  // points regardless of how low a reading happens to be.
  const MED_ROW_GAP = 10;
  const medBaseY = height + MED_ROW_GAP;
  const MIN_MARKER_GAP_PX = 14;
  let lastX = -Infinity;
  let stagger = 0;
  const staggeredMeds = medsInRange.map((m) => {
    const x = scaleX(m.t);
    stagger = x - lastX < MIN_MARKER_GAP_PX ? stagger + 1 : 0;
    lastX = x;
    return { ...m, x, extraLift: stagger * 7, color: medColorForName(m.name) };
  });
  // Bounded label set so the chart stays clean at every zoom level, not just some of
  // them. When there's room, label every point. When zoomed out to many points, don't
  // go silent — always surface the most recent reading and the peak, tagged so it's
  // clear why those two specifically are called out.
  const MAX_LABEL_ALL = 8;
  let valueLabels = [];
  function withCollisionAvoidance(points) {
    let lastLabelX = -Infinity;
    let labelBelow = false;
    return points.map((p) => {
      const x = scaleX(p.t);
      labelBelow = x - lastLabelX < 26 ? !labelBelow : false;
      lastLabelX = x;
      return { x, y: scaleY(p.v), value: p.v, below: labelBelow, tag: p.tag };
    });
  }
  if (kind === "temperature" && display.length > 0) {
    if (display.length <= MAX_LABEL_ALL) {
      valueLabels = withCollisionAvoidance(display);
    } else {
      const latest = display[display.length - 1];
      const peak = display.reduce((a, b) => (b.v > a.v ? b : a), display[0]);
      const chosen = [{ ...latest, tag: "Now" }];
      if (peak.t !== latest.t) chosen.push({ ...peak, tag: "Peak" });
      chosen.sort((a, b) => a.t - b.t);
      valueLabels = withCollisionAvoidance(chosen);
    }
  }

  const AXIS_ROW_HEIGHT = 14;
  const medRowHeight = showMedMarkers && staggeredMeds.length ? MED_ROW_GAP + 8 + Math.max(...staggeredMeds.map((m) => m.extraLift), 0) : 0;
  const chartHeight = height + medRowHeight + AXIS_ROW_HEIGHT;
  const sortedMedList = groupMedsByDisplayTime(medsInRange); // grouped-by-time, for the readable list only
  const xAxisY = chartHeight - 2;

  return (
    <div>
      <svg
        ref={svgRef}
        width={width}
        height={chartHeight}
        style={{ overflow: "visible", touchAction: "none" }}
        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}
        onTouchEnd={handleTouchEnd}
        onTouchCancel={handleTouchEnd}
        role="img"
        aria-label={`Trend chart from ${fmtAxisTime(minX)} to ${fmtAxisTime(maxX)}, scale ${minY} to ${maxY}${unit}, latest value ${last.v.toFixed(1)}${unit}${staggeredMeds.length ? `. Medications in range: ${staggeredMeds.map(medLabel).join("; ")}` : ""}${flaggedPeriodBands.length ? `. Flagged periods: ${flaggedPeriodBands.map((p) => p.label).join("; ")}` : ""}`}>
        {/* Flagged periods (relapses, flares, etc.) render first, as a background band
            behind everything else — a labeled stretch of time, not a specific reading. */}
        {flaggedPeriodBands.map((p) => (
          <g key={p.id}>
            <rect x={p.x1} y={pad} width={Math.max(p.x2 - p.x1, 2)} height={height - pad * 2} fill={amberSoft} opacity={0.6} />
            <text x={p.x1 + 3} y={pad + 9} fontSize={8} fontWeight={700} fill="#8A6D2B" fontFamily="-apple-system, sans-serif">
              {p.label}
            </text>
          </g>
        ))}
        {kind === "temperature" && (
          <rect x={chartLeft} y={scaleY(feverLine)} width={plotWidth} height={Math.max(scaleY(maxY) - scaleY(feverLine), 0)} fill={redSoft} opacity={0.5} />
        )}
        <text x={0} y={scaleY(maxY) + 3} style={axisLabelStyle}>{maxY.toFixed(0)}{unit}</text>
        <text x={0} y={scaleY(minY) - 1} style={axisLabelStyle}>{minY.toFixed(0)}{unit}</text>
        {kind === "temperature" && (
          <text x={0} y={scaleY(feverLine) + 3} style={{ ...axisLabelStyle, fill: red, fontWeight: 700 }}>{feverLine.toFixed(1)}</text>
        )}
        <line x1={chartLeft} y1={pad} x2={chartLeft} y2={height - pad} stroke={border} strokeWidth={1} />
        <text x={chartLeft} y={xAxisY} textAnchor="start" style={axisLabelStyle}>{fmtAxisTime(minX)}</text>
        <text x={width} y={xAxisY} textAnchor="end" style={axisLabelStyle}>{fmtAxisTime(maxX)}</text>
        <path d={d} fill="none" stroke={ink} strokeWidth={1.5} />
        {display.map((p, i) => (
          <circle key={i} cx={scaleX(p.t)} cy={scaleY(p.v)} r={4} fill={kind === "temperature" && p.v >= feverLine ? red : teal} />
        ))}
        {/* Temperature values written next to each point when there's room. Once a
            chart has more points than fit cleanly, it doesn't go silent — it always
            shows the most recent reading and the peak, tagged, so there's never a
            zoom level where the chart has numbers everywhere or nowhere. */}
        {valueLabels.map((l, i) => (
          <g key={i}>
            <text
              x={l.x} y={l.below ? l.y + 14 : l.y - 6} textAnchor="middle"
              fontSize={10} fontWeight={700} fill="none" stroke={card} strokeWidth={3} strokeLinejoin="round"
              fontFamily="-apple-system, sans-serif"
            >
              {l.tag ? `${l.tag} ` : ""}{l.value.toFixed(1)}{l.tag ? unit : ""}
            </text>
            <text
              x={l.x} y={l.below ? l.y + 14 : l.y - 6} textAnchor="middle"
              fontSize={10} fontWeight={700} fill={l.tag === "Peak" ? red : ink}
              fontFamily="-apple-system, sans-serif"
            >
              {l.tag ? `${l.tag} ` : ""}{l.value.toFixed(1)}{l.tag ? unit : ""}
            </text>
          </g>
        ))}
        {/* One marker per individual dose/session, colored by name — two things taken
            together are still two markers, just staggered close together, never
            merged into one. Diamonds are medications, circles are treatments — same
            positioning and coloring, shape is the only difference. Below the plot,
            in their own row, so they can never be confused with the actual data dots.
            The "Medications & treatments in view" list below is the readable source
            for names/details/times; these just mark when/what. */}
        {showMedMarkers && staggeredMeds.map((m) =>
          m.itemKind === "treatment" ? (
            <circle
              key={m.id}
              cx={m.x} cy={medBaseY + m.extraLift} r={4.5}
              fill={m.color} stroke={card} strokeWidth={1.5}
            />
          ) : (
            <rect
              key={m.id}
              x={-4.5} y={-4.5} width={9} height={9} rx={1.5}
              fill={m.color} stroke={card} strokeWidth={1.5}
              transform={`translate(${m.x}, ${medBaseY + m.extraLift}) rotate(45)`}
            />
          )
        )}
      </svg>

      {medsInRange.length > 0 && (
        <div style={{ marginTop: 4, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
          <button
            onClick={() => setShowMedList((s) => !s)}
            style={{ background: "none", border: "none", color: blue, fontSize: 11, fontWeight: 600, padding: 0, cursor: "pointer" }}
          >
            {showMedList ? "Hide" : `Medications & treatments in view (${medsInRange.length})`}
          </button>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: inkSoft, cursor: "pointer" }}>
            <input
              type="checkbox"
              checked={showMedMarkers}
              onChange={(e) => setShowMedMarkers(e.target.checked)}
              style={{ accentColor: blue, width: 14, height: 14 }}
            />
            Show on chart
          </label>
        </div>
      )}
      {medsInRange.length > 0 && (
        <div style={{ marginTop: 4 }}>
          {showMedList && (
            <div style={{ marginTop: 6, background: paper, border: `1px solid ${border}`, borderRadius: 10, padding: "6px 8px" }}>
              {sortedMedList.map((g) => (
                <div key={g.label + g.items[0].id} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "5px 0", borderBottom: `1px solid ${paperDark}` }}>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                    {g.items.map((m, i) => (
                      <span key={m.id} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12 }}>
                        {i > 0 && <span style={{ color: inkSoft }}>,</span>}
                        <span style={{ width: 8, height: 8, borderRadius: m.itemKind === "treatment" ? "50%" : 2, background: medColorForName(m.name), display: "inline-block", flexShrink: 0 }} />
                        <span style={{ color: ink, fontWeight: 600 }}>{medLabel(m)}</span>
                      </span>
                    ))}
                  </div>
                  <span style={{ color: inkSoft, fontSize: 12, flexShrink: 0 }}>{g.label}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function CareLog() {
  const [phase, setPhase] = useState("loading"); // loading | setup | locked | ready
  const [errorMsg, setErrorMsg] = useState("");
  const [showForgotPasscode, setShowForgotPasscode] = useState(false);
  const [passcodeInput, setPasscodeInput] = useState("");
  const [passcodeConfirm, setPasscodeConfirm] = useState("");

  const [trackers, setTrackers] = useState([]);
  const [entries, setEntries] = useState([]);
  const [meds, setMeds] = useState([]);
  const [concerns, setConcerns] = useState([]); // [{id, name}] — health concerns like "Cold/Flu", "Allergies"
  const [profile, setProfile] = useState({ ageYears: "", ageMonths: "", ethnicity: "", unitSystem: "imperial" });
  const [profileDraft, setProfileDraft] = useState({ ageYears: "", ageMonths: "", ethnicity: "" });

  const [showSettings, setShowSettings] = useState(false);
  const [showEmergencyResources, setShowEmergencyResources] = useState(false);
  const [showRecentlyDeleted, setShowRecentlyDeleted] = useState(false);
  const [showBackup, setShowBackup] = useState(false);
  const [restorePasscode, setRestorePasscode] = useState("");
  const [restoreFile, setRestoreFile] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const [restoreSuccess, setRestoreSuccess] = useState(false);
  const [setupRestoreMode, setSetupRestoreMode] = useState(false);

  const [view, setView] = useState("dashboard"); // dashboard | templatePicker
  const [templateQuery, setTemplateQuery] = useState("");
  const [openTemplateId, setOpenTemplateId] = useState(null);
  const [selectedTrackerNames, setSelectedTrackerNames] = useState([]);
  const [selectedConcernIds, setSelectedConcernIds] = useState([]);
  const [newConcernName, setNewConcernName] = useState("");
  const [dashboardViewMode, setDashboardViewMode] = useState("all"); // "all" | "byConcern"

  const [customTrackerDefs, setCustomTrackerDefs] = useState([]); // [{id, name, type, scaleMax}] — reusable, not tied to any one addition
  const [flaggedPeriods, setFlaggedPeriods] = useState([]); // [{id, concernId, label, startDate, endDate, deletedAt}] — relapses, flares, or any other labeled period
  const [treatments, setTreatments] = useState([]); // [{id, name, dose, timestamp, deletedAt}] — ECT, ketamine infusions, chemo, physical therapy, etc.; same shape as meds but clinic-administered, not self-taken
  const [treatmentName, setTreatmentName] = useState("");
  const [treatmentDetail, setTreatmentDetail] = useState("");
  const [treatmentMedNames, setTreatmentMedNames] = useState([]); // medications given as part of the treatment being logged
  const [treatmentNewMedName, setTreatmentNewMedName] = useState("");
  const [notes, setNotes] = useState([]); // [{id, text, timestamp, concernIds, deletedAt}] — time-grounded free-text context that doesn't fit a structured tracker
  const [noteText, setNoteText] = useState("");
  const [noteConcernIds, setNoteConcernIds] = useState([]);
  const [noteNewConcernName, setNoteNewConcernName] = useState("");
  const [markPeriodConcernId, setMarkPeriodConcernId] = useState(null); // which concern's "mark a period" form is open
  const [periodLabelInput, setPeriodLabelInput] = useState("Relapse");
  const [periodStartInput, setPeriodStartInput] = useState("");
  const [periodEndInput, setPeriodEndInput] = useState("");
  const [showCustomTrackerForm, setShowCustomTrackerForm] = useState(false);
  const [customTrackerNameInput, setCustomTrackerNameInput] = useState("");
  const [customTrackerType, setCustomTrackerType] = useState("scale");
  const [pendingCustomTracker, setPendingCustomTracker] = useState(null); // {name, type, scaleMax, sourceCustomDefinitionId?}

  const [draftValues, setDraftValues] = useState({});
  const [medName, setMedName] = useState("");
  const [medDose, setMedDose] = useState("");
  const [showReport, setShowReport] = useState(false);
  const [reportCopied, setReportCopied] = useState(false);

  const [saveError, setSaveError] = useState(false);

  const cryptoKeyRef = useRef(null);
  const saltRef = useRef(null);
  const skippedInitialPersist = useRef(false);
  const loadedRef = useRef(false);

  // ---------- Initial load ----------
  useEffect(() => {
    (async () => {
      try {
        const res = await LocalStore.get(STORAGE_KEY, false);
        if (res && res.value) {
          const vault = JSON.parse(res.value);
          saltRef.current = vault.saltB64;
          setPhase("locked-waiting"); // vault exists, needs passcode; render locked screen below
          setPhase("locked");
        } else {
          setPhase("setup");
        }
      } catch (e) {
        setPhase("setup");
      }
    })();
  }, []);

  // ---------- Persist (encrypt + save) ----------
  const persist = useCallback(async (nextTrackers, nextEntries, nextMeds, nextProfile, nextConcerns, nextCustomDefs, nextFlaggedPeriods, nextTreatments, nextNotes) => {
    if (!cryptoKeyRef.current) return;
    const payload = { trackers: nextTrackers, entries: nextEntries, meds: nextMeds, profile: nextProfile, concerns: nextConcerns, customTrackerDefs: nextCustomDefs, flaggedPeriods: nextFlaggedPeriods, treatments: nextTreatments, notes: nextNotes };
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const { iv, ciphertext } = await encryptJSON(cryptoKeyRef.current, payload);
        const vault = { saltB64: saltRef.current, iterations: PBKDF2_ITERATIONS, iv, ciphertext };
        const result = await LocalStore.set(STORAGE_KEY, JSON.stringify(vault), false);
        if (result) {
          setSaveError(false);
          return;
        }
      } catch (e) {
        console.error("care-log: persist failed", { attempt: attempt + 1, error: e });
      }
      if (attempt < 2) await sleep(400 * (attempt + 1));
    }
    setSaveError(true);
  }, []);

  useEffect(() => {
    if (phase !== "ready") return;
    if (!skippedInitialPersist.current) {
      skippedInitialPersist.current = true;
      return;
    }
    persist(trackers, entries, meds, profile, concerns, customTrackerDefs, flaggedPeriods, treatments, notes);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [trackers, entries, meds, profile, concerns, customTrackerDefs, flaggedPeriods, treatments, notes]);

  // ---------- Setup (first run — create passcode) ----------
  async function handleCreatePasscode() {
    setErrorMsg("");
    if (passcodeInput.length < 4) {
      setErrorMsg("Use at least 4 characters.");
      return;
    }
    if (passcodeInput !== passcodeConfirm) {
      setErrorMsg("Passcodes don't match.");
      return;
    }
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));
    const saltB64 = bufToB64(saltBytes.buffer);
    saltRef.current = saltB64;
    const key = await deriveKey(passcodeInput, saltB64, PBKDF2_ITERATIONS);
    cryptoKeyRef.current = key;
    setPasscodeInput("");
    setPasscodeConfirm("");
    setPhase("setup-profile"); // don't persist yet — collect the (mostly optional) profile first
  }

  async function handleSaveProfile() {
    setErrorMsg("");
    const ageYears = profileDraft.ageYears === "" ? null : parseInt(profileDraft.ageYears, 10);
    const ageMonths = profileDraft.ageMonths === "" ? null : parseInt(profileDraft.ageMonths, 10);
    if ((ageYears === null || isNaN(ageYears)) && (ageMonths === null || isNaN(ageMonths))) {
      setErrorMsg("Age is required — years, or months for an infant.");
      return;
    }
    const nextProfile = {
      ageYears: ageYears || 0,
      ageMonths: ageMonths || 0,
      ethnicity: profileDraft.ethnicity.trim(),
      unitSystem: "imperial",
    };
    if (!cryptoKeyRef.current || !saltRef.current) {
      setErrorMsg("Something went wrong setting up encryption — please go back and re-create your passcode.");
      return;
    }
    try {
      const { iv, ciphertext } = await encryptJSON(cryptoKeyRef.current, { trackers: [], entries: [], meds: [], profile: nextProfile, concerns: [], customTrackerDefs: [], flaggedPeriods: [], treatments: [], notes: [] });
      const vault = { saltB64: saltRef.current, iterations: PBKDF2_ITERATIONS, iv, ciphertext };
      const result = await LocalStore.set(STORAGE_KEY, JSON.stringify(vault), false);
      if (!result) throw new Error("storage.set returned no result");
      setProfile(nextProfile);
      skippedInitialPersist.current = true;
      setPhase("ready");
    } catch (e) {
      console.error("care-log: failed to save profile", e);
      setErrorMsg("Couldn't save — check your connection and try Continue again.");
    }
  }

  // ---------- Lock screen (unlock) ----------
  async function handleUnlock() {
    setErrorMsg("");
    try {
      const res = await LocalStore.get(STORAGE_KEY, false);
      const vault = JSON.parse(res.value);
      const key = await deriveKey(passcodeInput, vault.saltB64, vault.iterations);
      const data = await decryptJSON(key, vault.iv, vault.ciphertext);
      cryptoKeyRef.current = key;
      saltRef.current = vault.saltB64;
      setTrackers(data.trackers || []);
      setEntries(data.entries || []);
      setMeds(data.meds || []);
      setConcerns(data.concerns || []);
      setCustomTrackerDefs(data.customTrackerDefs || []);
      setFlaggedPeriods(data.flaggedPeriods || []);
      setTreatments(data.treatments || []);
      setNotes(data.notes || []);
      setProfile(data.profile || { ageYears: "", ageMonths: "", ethnicity: "", unitSystem: "imperial" });
      skippedInitialPersist.current = true;
      setPasscodeInput("");
      setPhase("ready");
    } catch (e) {
      setErrorMsg("Incorrect passcode. Try again.");
    }
  }

  // A forgotten passcode makes the existing vault permanently unreadable — that's
  // the zero-knowledge design working as intended, not a bug, and nothing here
  // changes that. This just clears the now-inaccessible encrypted data so the app
  // isn't a dead end, and returns to first-run setup for a genuinely new passcode.
  async function startFresh() {
    try {
      await LocalStore.delete(STORAGE_KEY, false);
    } catch (e) {
      console.error("care-log: failed to clear vault on start-fresh", e);
    }
    cryptoKeyRef.current = null;
    saltRef.current = null;
    setTrackers([]);
    setEntries([]);
    setMeds([]);
    setConcerns([]);
    setCustomTrackerDefs([]);
    setFlaggedPeriods([]);
    setTreatments([]);
    setNotes([]);
    setProfile({ ageYears: "", ageMonths: "", ethnicity: "", unitSystem: "imperial" });
    setPasscodeInput("");
    setErrorMsg("");
    setShowForgotPasscode(false);
    skippedInitialPersist.current = false;
    setPhase("setup");
  }

  // ---------- Backup export / restore ----------
  async function downloadEncryptedBackup(payload, filenameTag) {
    if (!cryptoKeyRef.current) return;
    const { iv, ciphertext } = await encryptJSON(cryptoKeyRef.current, payload);
    const backup = { formatVersion: 1, saltB64: saltRef.current, iterations: PBKDF2_ITERATIONS, iv, ciphertext, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `care-log-backup-${filenameTag}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function handleExportBackup() {
    await downloadEncryptedBackup({ trackers, entries, meds, profile, concerns, customTrackerDefs, flaggedPeriods, treatments, notes }, "manual");
  }

  async function handleRestoreFromFile(file, passcode, isFirstRun) {
    setRestoreError("");
    setRestoreSuccess(false);
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      const key = await deriveKey(passcode, backup.saltB64, backup.iterations);
      // A successful decrypt IS the integrity check — AES-GCM's auth tag makes a
      // tampered or corrupted file fail here rather than silently restoring bad data.
      // Decrypt and validate the incoming file FIRST, before touching anything —
      // if it's wrong, nothing about the current session has changed yet.
      const data = await decryptJSON(key, backup.iv, backup.ciphertext);

      // Restoring is genuinely destructive — it replaces everything. Before doing
      // that, automatically save a snapshot of what's about to be overwritten, using
      // the CURRENT key/salt (not yet switched to the incoming backup's), so there's
      // always a real, durable way to undo this by re-importing that snapshot later —
      // not just a same-session convenience that's gone the moment the tab closes.
      if (!isFirstRun) {
        await downloadEncryptedBackup(
          { trackers, entries, meds, profile, concerns, customTrackerDefs, flaggedPeriods, treatments, notes },
          "before-restore"
        );
      }

      cryptoKeyRef.current = key;
      saltRef.current = backup.saltB64;
      setTrackers(data.trackers || []);
      setEntries(data.entries || []);
      setMeds(data.meds || []);
      setConcerns(data.concerns || []);
      setCustomTrackerDefs(data.customTrackerDefs || []);
      setFlaggedPeriods(data.flaggedPeriods || []);
      setTreatments(data.treatments || []);
      setNotes(data.notes || []);
      setProfile(data.profile || { ageYears: "", ageMonths: "", ethnicity: "", unitSystem: "imperial" });
      skippedInitialPersist.current = true;
      setRestoreSuccess(true);
      if (isFirstRun) {
        setPhase("ready");
      } else {
        await persist(data.trackers || [], data.entries || [], data.meds || [], data.profile || profile, data.concerns || [], data.customTrackerDefs || [], data.flaggedPeriods || [], data.treatments || [], data.notes || []);
        setShowBackup(false);
      }
    } catch (e) {
      setRestoreError("Couldn't restore — check the file and passcode, or the file may be from a different backup.");
    }
  }

  // ---------- Derived data ----------
  const activeTrackers = useMemo(() => trackers.filter((t) => !t.archived), [trackers]);
  const remainingSlots = MAX_TRACKERS - activeTrackers.length;

  // Soft-deleted entries/meds stay in storage (so they're restorable) but are excluded
  // from every normal read — display, charts, reports, counts. Only the "Recently
  // deleted" recovery panel reads the raw arrays including deleted items.
  const activeEntries = useMemo(() => entries.filter((e) => !e.deletedAt), [entries]);
  const activeMeds = useMemo(() => meds.filter((m) => !m.deletedAt), [meds]);
  const deletedEntries = useMemo(
    () => entries.filter((e) => e.deletedAt).sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt)),
    [entries]
  );
  const deletedMeds = useMemo(
    () => meds.filter((m) => m.deletedAt).sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt)),
    [meds]
  );
  const activeFlaggedPeriods = useMemo(() => flaggedPeriods.filter((p) => !p.deletedAt), [flaggedPeriods]);
  const deletedFlaggedPeriods = useMemo(
    () => flaggedPeriods.filter((p) => p.deletedAt).sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt)),
    [flaggedPeriods]
  );
  const activeTreatments = useMemo(() => treatments.filter((t) => !t.deletedAt), [treatments]);
  const deletedTreatments = useMemo(
    () => treatments.filter((t) => t.deletedAt).sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt)),
    [treatments]
  );
  const activeNotes = useMemo(() => notes.filter((n) => !n.deletedAt), [notes]);
  const deletedNotes = useMemo(
    () => notes.filter((n) => n.deletedAt).sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt)),
    [notes]
  );

  // Absolute bounds — the full span of everything logged. Zoom/pan and range
  // presets are always clamped within this, so you can't pan into empty space.
  const fullDomain = useMemo(() => {
    const times = [];
    activeTrackers.forEach((t) => {
      activeEntries.forEach((e) => {
        const v = e.values[t.id];
        if (v != null && typeof v !== "boolean") times.push(new Date(e.timestamp).getTime());
      });
    });
    activeMeds.forEach((m) => times.push(new Date(m.timestamp).getTime()));
    if (times.length === 0) return null;
    return { minX: Math.min(...times), maxX: Math.max(...times) };
  }, [activeTrackers, activeEntries, activeMeds]);

  const [rangePreset, setRangePreset] = useState("all"); // "24h" | "3d" | "7d" | "all"
  const [customViewDomain, setCustomViewDomain] = useState(null); // set by pinch/drag on any chart

  const presetDomain = useMemo(() => {
    if (rangePreset === "all" || !fullDomain) return null;
    const hours = { "24h": 24, "3d": 72, "7d": 168 }[rangePreset];
    const end = Math.max(Date.now(), fullDomain.maxX);
    return { minX: end - hours * 3600 * 1000, maxX: end };
  }, [rangePreset, fullDomain]);

  // One shared time domain for every chart, so trackers and medications are always
  // plotted on the same timeline and can be visually compared side by side, rather
  // than each card silently picking its own window.
  const chartDomain = customViewDomain || presetDomain || fullDomain;
  const isZoomed = customViewDomain !== null || rangePreset !== "all";

  function selectRangePreset(preset) {
    setRangePreset(preset);
    setCustomViewDomain(null);
  }

  function resetView() {
    setRangePreset("all");
    setCustomViewDomain(null);
  }

  // Called by any chart's pinch/drag gesture. Clamps to fullDomain (with a little
  // outward padding so you can pan slightly past the edges) and enforces a minimum
  // zoomed-in span so the view can never collapse to nothing.
  function handleViewChange(nextDomain) {
    if (!fullDomain) return;
    const MIN_SPAN = 30 * 60 * 1000; // 30 minutes
    let { minX, maxX } = nextDomain;
    if (maxX - minX < MIN_SPAN) {
      const mid = (minX + maxX) / 2;
      minX = mid - MIN_SPAN / 2;
      maxX = mid + MIN_SPAN / 2;
    }
    const pad = Math.max((fullDomain.maxX - fullDomain.minX) * 0.1, MIN_SPAN);
    const lower = fullDomain.minX - pad;
    const upper = fullDomain.maxX + pad;
    if (minX < lower) { maxX += lower - minX; minX = lower; }
    if (maxX > upper) { minX -= maxX - upper; maxX = upper; }
    setCustomViewDomain({ minX: Math.max(minX, lower), maxX: Math.min(maxX, upper) });
  }

  const knownMedNames = useMemo(() => [...new Set(activeMeds.map((m) => m.name.trim().toLowerCase()))], [activeMeds]);
  const medCatalogCount = knownMedNames.length;
  // Original-case distinct medication names (knownMedNames above is lowercased for
  // dedup checks) — used for the treatment-medication-linking picker's display.
  const distinctMedNamesDisplay = useMemo(() => {
    const seen = new Map();
    activeMeds.forEach((m) => {
      const key = m.name.trim().toLowerCase();
      if (!seen.has(key)) seen.set(key, m.name.trim());
    });
    return [...seen.values()];
  }, [activeMeds]);

  const filteredTemplates = useMemo(() => {
    const q = templateQuery.trim().toLowerCase();
    if (!q) return TEMPLATES;
    return TEMPLATES.filter(
      (t) => t.label.toLowerCase().includes(q) || t.searchTerms.some((s) => s.includes(q))
    );
  }, [templateQuery]);

  const filteredCustomDefs = useMemo(() => {
    const q = templateQuery.trim().toLowerCase();
    if (!q) return customTrackerDefs;
    return customTrackerDefs.filter((d) => d.name.toLowerCase().includes(q));
  }, [templateQuery, customTrackerDefs]);

  function trackerSeries(trackerId) {
    const tracker = trackers.find((t) => t.id === trackerId);
    return activeEntries
      .filter((e) => e.values[trackerId] != null && typeof e.values[trackerId] !== "boolean")
      .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
      .map((e) => {
        const raw = e.values[trackerId];
        const v = tracker && tracker.type === "questionnaire" ? raw.score : raw;
        return { t: new Date(e.timestamp).getTime(), v };
      });
  }

  function latestEntryFor(trackerId) {
    return [...activeEntries]
      .filter((e) => e.values[trackerId] != null)
      .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
  }

  // Full history for a tracker (any value type, including booleans) — used by the
  // per-tracker History list, most recent first.
  function entriesForTracker(trackerId) {
    return activeEntries
      .filter((e) => e.values[trackerId] != null)
      .map((e) => ({ id: e.id, timestamp: e.timestamp, value: e.values[trackerId] }))
      .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  }

  function updateEntryValue(entryId, trackerId, newValue, newTimeInput) {
    setEntries((prev) =>
      prev.map((e) => {
        if (e.id !== entryId) return e;
        const timestamp = newTimeInput ? new Date(newTimeInput).toISOString() : e.timestamp;
        return { ...e, timestamp, values: { ...e.values, [trackerId]: newValue } };
      })
    );
  }

  function deleteEntryValue(entryId, trackerId) {
    // Soft delete — every entry created by this app only ever holds one tracker's
    // value, so removing that value is equivalent to removing the whole entry.
    // Marked deleted, not erased, so it can be undone from Recently Deleted.
    setEntries((prev) => prev.map((e) => (e.id === entryId ? { ...e, deletedAt: new Date().toISOString() } : e)));
  }

  function restoreEntry(entryId) {
    setEntries((prev) => prev.map((e) => (e.id === entryId ? { ...e, deletedAt: undefined } : e)));
  }

  // ---------- Actions ----------
  function openTemplate(id) {
    const t = TEMPLATES.find((tt) => tt.id === id);
    if (!t) return;
    const preselect = t.trackers.slice(0, Math.max(remainingSlots, 0)).map((tr) => tr.name);
    setSelectedTrackerNames(preselect);
    // If a concern already exists with this template's name, suggest attaching to it
    // instead of silently creating a duplicate; otherwise suggest creating a new one.
    const existingMatch = concerns.find((c) => c.name.toLowerCase() === t.label.toLowerCase());
    setSelectedConcernIds(existingMatch ? [existingMatch.id] : []);
    setNewConcernName(existingMatch ? "" : t.label);
    setOpenTemplateId(id);
  }

  function toggleTrackerSelection(name) {
    setSelectedTrackerNames((prev) => (prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]));
  }

  function toggleConcernSelection(id) {
    setSelectedConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }

  function toggleTreatmentMedName(name) {
    setTreatmentMedNames((prev) => (prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]));
  }

  function toggleNoteConcern(id) {
    setNoteConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }

  // Shared by the template-add, custom-tracker, medication, and treatment flows —
  // resolves the selected/typed concerns into a final id list, creating a new
  // Concern only if the typed name doesn't match one that already exists.
  function resolveConcernIds(selectedIds, newName) {
    let finalConcernIds = [...selectedIds];
    const trimmedNew = (newName || "").trim();
    if (trimmedNew) {
      const existing = concerns.find((c) => c.name.toLowerCase() === trimmedNew.toLowerCase());
      if (existing) {
        if (!finalConcernIds.includes(existing.id)) finalConcernIds.push(existing.id);
      } else {
        const newConcern = { id: uid(), name: trimmedNew };
        setConcerns((prev) => [...prev, newConcern]);
        finalConcernIds.push(newConcern.id);
      }
    }
    return finalConcernIds;
  }

  function addSelectedTrackers() {
    const template = TEMPLATES.find((t) => t.id === openTemplateId);
    if (!template) return;
    const toAdd = template.trackers.filter((tr) => selectedTrackerNames.includes(tr.name));
    if (toAdd.length === 0 || toAdd.length > remainingSlots) return;

    // A tracker can end up tagged with multiple concerns — that's the point, since a
    // symptom like a cough can genuinely belong to more than one thing at once.
    const finalConcernIds = resolveConcernIds(selectedConcernIds, newConcernName);

    const newTrackers = toAdd.map((tr) => ({
      id: uid(),
      name: tr.name,
      type: tr.type,
      unit: tr.unit,
      scaleMax: tr.scaleMax || 5,
      sourceTemplateId: template.id,
      concernIds: finalConcernIds,
      archived: false,
    }));
    setTrackers((prev) => [...prev, ...newTrackers]);
    setOpenTemplateId(null);
    setSelectedTrackerNames([]);
    setSelectedConcernIds([]);
    setNewConcernName("");
    setTemplateQuery("");
    setView("dashboard");
  }

  // ---------- Custom tracker flow ----------
  function startCustomTrackerFlow(prefillName) {
    setCustomTrackerNameInput(prefillName || "");
    setCustomTrackerType("scale");
    setShowCustomTrackerForm(true);
  }

  function cancelCustomTrackerForm() {
    setShowCustomTrackerForm(false);
    setCustomTrackerNameInput("");
  }

  function confirmCustomTrackerDetails() {
    const name = customTrackerNameInput.trim();
    if (!name) return;
    const existingMatch = concerns.find((c) => c.name.toLowerCase() === name.toLowerCase());
    setSelectedConcernIds(existingMatch ? [existingMatch.id] : []);
    setNewConcernName("");
    setPendingCustomTracker({ name, type: customTrackerType, scaleMax: 5 });
    setShowCustomTrackerForm(false);
  }

  function selectExistingCustomDef(def) {
    setSelectedConcernIds([]);
    setNewConcernName("");
    setPendingCustomTracker({ name: def.name, type: def.type, scaleMax: def.scaleMax, sourceCustomDefinitionId: def.id });
  }

  function selectQuestionnaire(q) {
    setSelectedConcernIds([]);
    setNewConcernName("");
    setPendingCustomTracker({ name: q.name, type: "questionnaire", scaleMax: questionnaireMaxScore(q), questionnaireId: q.id });
  }

  function cancelPendingCustomTracker() {
    setPendingCustomTracker(null);
    setSelectedConcernIds([]);
    setNewConcernName("");
  }

  function addPendingCustomTracker() {
    if (!pendingCustomTracker || remainingSlots <= 0) return;
    const finalConcernIds = resolveConcernIds(selectedConcernIds, newConcernName);

    // Questionnaires reference a QUESTIONNAIRES entry directly — no separate reusable
    // CustomTrackerDefinition needed, since QUESTIONNAIRES already is that reusable list.
    let defId = pendingCustomTracker.sourceCustomDefinitionId;
    if (!defId && !pendingCustomTracker.questionnaireId) {
      const newDef = { id: uid(), name: pendingCustomTracker.name, type: pendingCustomTracker.type, scaleMax: pendingCustomTracker.scaleMax };
      setCustomTrackerDefs((prev) => [...prev, newDef]);
      defId = newDef.id;
    }

    const newTracker = {
      id: uid(),
      name: pendingCustomTracker.name,
      type: pendingCustomTracker.type,
      scaleMax: pendingCustomTracker.scaleMax,
      sourceCustomDefinitionId: defId,
      questionnaireId: pendingCustomTracker.questionnaireId || undefined,
      concernIds: finalConcernIds,
      archived: false,
    };
    setTrackers((prev) => [...prev, newTracker]);
    setPendingCustomTracker(null);
    setSelectedConcernIds([]);
    setNewConcernName("");
    setTemplateQuery("");
    setView("dashboard");
  }

  function archiveTracker(id) {
    setTrackers((prev) => prev.map((t) => (t.id === id ? { ...t, archived: true } : t)));
  }

  function logValue(trackerId, value, isTemperature, atTime) {
    const timestamp = atTime ? new Date(atTime).toISOString() : new Date().toISOString();
    const stored = isTemperature ? toCelsius(value, profile.unitSystem) : value;
    setEntries((prev) => [...prev, { id: uid(), timestamp, values: { [trackerId]: stored } }]);
    setDraftValues((d) => ({ ...d, [trackerId]: undefined }));
  }

  function addMedication(atTime, concernSelection, newConcernNameInput) {
    const name = medName.trim();
    if (!name) return;
    const isNewDistinct = !knownMedNames.includes(name.toLowerCase());
    if (isNewDistinct && medCatalogCount >= MAX_MEDICATIONS) return;
    const timestamp = atTime ? new Date(atTime).toISOString() : new Date().toISOString();
    const concernIds = resolveConcernIds(concernSelection || [], newConcernNameInput || "");
    setMeds((prev) => [...prev, { id: uid(), name, dose: medDose.trim(), timestamp, concernIds }]);
    setMedName("");
    setMedDose("");
  }

  function deleteMed(id) {
    setMeds((prev) => prev.map((m) => (m.id === id ? { ...m, deletedAt: new Date().toISOString() } : m)));
  }

  function restoreMed(id) {
    setMeds((prev) => prev.map((m) => (m.id === id ? { ...m, deletedAt: undefined } : m)));
  }

  // ---------- Flagged periods (relapses, flares, or any other labeled period) ----------
  function openMarkPeriodForm(concernId) {
    setMarkPeriodConcernId(concernId);
    setPeriodLabelInput("Relapse");
    setPeriodStartInput(new Date().toISOString().slice(0, 10));
    setPeriodEndInput("");
  }

  function cancelMarkPeriodForm() {
    setMarkPeriodConcernId(null);
  }

  function addFlaggedPeriod() {
    const label = periodLabelInput.trim();
    if (!label || !periodStartInput) return;
    const newPeriod = {
      id: uid(),
      concernId: markPeriodConcernId,
      label,
      startDate: periodStartInput,
      endDate: periodEndInput || null, // no end date = ongoing
    };
    setFlaggedPeriods((prev) => [...prev, newPeriod]);
    setMarkPeriodConcernId(null);
  }

  function deleteFlaggedPeriod(id) {
    setFlaggedPeriods((prev) => prev.map((p) => (p.id === id ? { ...p, deletedAt: new Date().toISOString() } : p)));
  }

  function restoreFlaggedPeriod(id) {
    setFlaggedPeriods((prev) => prev.map((p) => (p.id === id ? { ...p, deletedAt: undefined } : p)));
  }

  function updateMed(id, newName, newDose, newTimeInput, newConcernIds) {
    setMeds((prev) =>
      prev.map((m) =>
        m.id === id
          ? { ...m, name: newName, dose: newDose, timestamp: newTimeInput ? new Date(newTimeInput).toISOString() : m.timestamp, concernIds: newConcernIds }
          : m
      )
    );
  }

  // ---------- Treatments (ECT, ketamine infusions, chemo, physical therapy, etc.) ----------
  // Same shape and pattern as medications — clinic-administered rather than self-taken,
  // so kept as a separate list/section rather than mixed into the medication log.
  function addTreatment(atTime, concernSelection, newConcernNameInput) {
    const name = treatmentName.trim();
    if (!name) return;
    const timestamp = atTime ? new Date(atTime).toISOString() : new Date().toISOString();
    // Linked medications: selected known names, plus a typed new one if it doesn't
    // already match an existing name — same resolve-or-create pattern used for
    // concerns, just without needing to persist a new entity (this is a label list).
    const typed = treatmentNewMedName.trim();
    const finalMedNames = [...treatmentMedNames];
    if (typed && !finalMedNames.some((n) => n.toLowerCase() === typed.toLowerCase())) {
      finalMedNames.push(typed);
    }
    const concernIds = resolveConcernIds(concernSelection || [], newConcernNameInput || "");
    setTreatments((prev) => [...prev, { id: uid(), name, dose: treatmentDetail.trim(), timestamp, medicationNames: finalMedNames, concernIds }]);
    setTreatmentName("");
    setTreatmentDetail("");
    setTreatmentMedNames([]);
    setTreatmentNewMedName("");
  }

  function deleteTreatment(id) {
    setTreatments((prev) => prev.map((t) => (t.id === id ? { ...t, deletedAt: new Date().toISOString() } : t)));
  }

  function restoreTreatment(id) {
    setTreatments((prev) => prev.map((t) => (t.id === id ? { ...t, deletedAt: undefined } : t)));
  }

  function updateTreatment(id, newName, newDetail, newTimeInput, newMedicationNames, newConcernIds) {
    setTreatments((prev) =>
      prev.map((t) =>
        t.id === id
          ? { ...t, name: newName, dose: newDetail, timestamp: newTimeInput ? new Date(newTimeInput).toISOString() : t.timestamp, medicationNames: newMedicationNames, concernIds: newConcernIds }
          : t
      )
    );
  }

  // ---------- Notes (time-grounded free-text context) ----------
  function addNote(atTime, concernSelection, newConcernNameInput) {
    const text = noteText.trim();
    if (!text) return;
    const timestamp = atTime ? new Date(atTime).toISOString() : new Date().toISOString();
    const concernIds = resolveConcernIds(concernSelection || [], newConcernNameInput || "");
    setNotes((prev) => [...prev, { id: uid(), text, timestamp, concernIds }]);
    setNoteText("");
    setNoteConcernIds([]);
    setNoteNewConcernName("");
  }

  function deleteNote(id) {
    setNotes((prev) => prev.map((n) => (n.id === id ? { ...n, deletedAt: new Date().toISOString() } : n)));
  }

  function restoreNote(id) {
    setNotes((prev) => prev.map((n) => (n.id === id ? { ...n, deletedAt: undefined } : n)));
  }

  function updateNote(id, newText, newTimeInput, newConcernIds) {
    setNotes((prev) =>
      prev.map((n) =>
        n.id === id
          ? { ...n, text: newText, timestamp: newTimeInput ? new Date(newTimeInput).toISOString() : n.timestamp, concernIds: newConcernIds }
          : n
      )
    );
  }

  const reportText = useMemo(() => {
    const since = new Date(Date.now() - 72 * 3600 * 1000);
    const lines = [`Care Log summary — last 72 hours`, `Generated ${new Date().toLocaleString()}`, ""];
    activeTrackers.forEach((t) => {
      const recent = activeEntries
        .filter((e) => e.values[t.id] != null && new Date(e.timestamp) >= since)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      lines.push(`${t.name}:`);
      if (recent.length === 0) lines.push("  no readings");
      else recent.forEach((e) => {
        const raw = e.values[t.id];
        const v = t.type === "temperature"
          ? displayTemp(raw, profile.unitSystem).toFixed(1)
          : t.type === "questionnaire"
            ? `${raw.score}/${t.scaleMax} (${raw.band})`
            : raw;
        lines.push(`  ${fmtTime(e.timestamp)} — ${v}${t.type === "temperature" ? tempUnitLabel(profile.unitSystem) : ""}`);
      });
      lines.push("");
    });
    const recentMeds = activeMeds
      .filter((m) => new Date(m.timestamp) >= since)
      .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    lines.push("Medications:");
    if (recentMeds.length === 0) lines.push("  none logged");
    else groupMedsByDisplayTime(recentMeds).forEach((g) =>
      lines.push(`  ${g.label} — ${g.items.map(medLabel).join(", ")}`)
    );
    lines.push("");
    const recentTreatments = activeTreatments
      .filter((t) => new Date(t.timestamp) >= since)
      .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    lines.push("Treatments:");
    if (recentTreatments.length === 0) lines.push("  none logged");
    else groupMedsByDisplayTime(recentTreatments).forEach((g) =>
      lines.push(`  ${g.label} — ${g.items.map((t) => `${medLabel(t)}${t.medicationNames && t.medicationNames.length > 0 ? ` (with ${t.medicationNames.join(", ")})` : ""}`).join(", ")}`)
    );
    lines.push("");
    const recentNotes = activeNotes
      .filter((n) => new Date(n.timestamp) >= since)
      .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    lines.push("Notes:");
    if (recentNotes.length === 0) lines.push("  none logged");
    else recentNotes.forEach((n) => lines.push(`  ${fmtTime(n.timestamp)} — ${n.text}`));
    return lines.join("\n");
  }, [activeTrackers, activeEntries, activeMeds, activeTreatments, activeNotes, profile.unitSystem]);

  async function copyReport() {
    try {
      await navigator.clipboard.writeText(reportText);
      setReportCopied(true);
      setTimeout(() => setReportCopied(false), 2000);
    } catch (e) {
      // clipboard may be blocked; text is still selectable on screen
    }
  }

  // ---------- Render ----------
  if (phase === "loading") {
    return <div style={{ background: paper, minHeight: "100vh" }} />;
  }

  if (phase === "setup") {
    return (
      <Screen title="Set up your passcode">
        <p style={{ fontSize: 14, color: inkSoft, margin: "0 0 10px" }}>
          This locks the app and encrypts everything you log.
        </p>
        <div style={{ background: redSoft, border: `1px solid ${red}`, borderRadius: 12, padding: 12, margin: "0 0 18px" }}>
          <p style={{ fontSize: 14, color: ink, margin: 0, fontWeight: 600 }}>
            There's no account and no password reset. If you forget this passcode, your data can't be recovered — by us or anyone else. Write it down somewhere safe.
          </p>
        </div>
        {!setupRestoreMode ? (
          <>
            <Field label="Passcode">
              <input type="password" value={passcodeInput} onChange={(e) => setPasscodeInput(e.target.value)} style={inputStyle} autoFocus />
            </Field>
            <Field label="Confirm passcode">
              <input type="password" value={passcodeConfirm} onChange={(e) => setPasscodeConfirm(e.target.value)} style={inputStyle} />
            </Field>
            {errorMsg && <div style={errorStyle}>{errorMsg}</div>}
            <button style={primaryBtn} onClick={handleCreatePasscode}>Create passcode</button>
            <button style={linkBtn} onClick={() => setSetupRestoreMode(true)}>Restore from a backup instead</button>
          </>
        ) : (
          <>
            <Field label="Backup file">
              <input type="file" accept="application/json" onChange={(e) => setRestoreFile(e.target.files[0] || null)} style={inputStyle} />
            </Field>
            <Field label="Backup passcode">
              <input type="password" value={restorePasscode} onChange={(e) => setRestorePasscode(e.target.value)} style={inputStyle} />
            </Field>
            {restoreError && <div style={errorStyle}>{restoreError}</div>}
            <button
              style={{ ...primaryBtn, opacity: !restoreFile || !restorePasscode ? 0.5 : 1 }}
              disabled={!restoreFile || !restorePasscode}
              onClick={() => handleRestoreFromFile(restoreFile, restorePasscode, true)}
            >
              Restore
            </button>
            <button style={linkBtn} onClick={() => setSetupRestoreMode(false)}>Set up a new passcode instead</button>
          </>
        )}
      </Screen>
    );
  }

  if (phase === "setup-profile") {
    return (
      <Screen title="About the person you're tracking">
        <p style={{ fontSize: 14, color: inkSoft, margin: "0 0 18px" }}>
          Only age is required. This helps show age-appropriate ranges — it never limits which
          trackers are available to you.
        </p>
        <div style={{ display: "flex", gap: 8 }}>
          <Field label="Age (years)">
            <input type="number" min="0" value={profileDraft.ageYears} onChange={(e) => setProfileDraft((p) => ({ ...p, ageYears: e.target.value }))} style={inputStyle} autoFocus />
          </Field>
          <Field label="Or months, if an infant">
            <input type="number" min="0" value={profileDraft.ageMonths} onChange={(e) => setProfileDraft((p) => ({ ...p, ageMonths: e.target.value }))} style={inputStyle} />
          </Field>
        </div>
        <Field label="Ethnic background (optional)">
          <input value={profileDraft.ethnicity} onChange={(e) => setProfileDraft((p) => ({ ...p, ethnicity: e.target.value }))} style={inputStyle} placeholder="Prefer not to say — leave blank" />
        </Field>
        {errorMsg && <div style={errorStyle}>{errorMsg}</div>}
        <button style={primaryBtn} onClick={handleSaveProfile}>Continue</button>
      </Screen>
    );
  }

  if (phase === "locked") {
    return (
      <Screen title="Enter your passcode">
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
          <Lock size={28} color={inkSoft} />
        </div>
        <Field label="Passcode">
          <input
            type="password"
            value={passcodeInput}
            onChange={(e) => setPasscodeInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && handleUnlock()}
            style={inputStyle}
            autoFocus
          />
        </Field>
        {errorMsg && <div style={errorStyle}>{errorMsg}</div>}
        <button style={primaryBtn} onClick={handleUnlock}>Unlock</button>

        {!showForgotPasscode ? (
          <button
            onClick={() => setShowForgotPasscode(true)}
            style={{ background: "none", border: "none", color: inkSoft, fontSize: 13, cursor: "pointer", display: "block", margin: "16px auto 0", textDecoration: "underline" }}
          >
            Forgot your passcode?
          </button>
        ) : (
          <div style={{ background: redSoft, border: `1px solid ${red}`, borderRadius: 12, padding: 12, marginTop: 16 }}>
            <p style={{ fontSize: 13, color: ink, margin: "0 0 8px", fontWeight: 600 }}>
              There's no way to recover a forgotten passcode — that's the zero-knowledge design working as intended, not something we can override.
            </p>
            <p style={{ fontSize: 13, color: ink, margin: "0 0 10px" }}>
              Starting fresh only erases Care Log's own data on this device — not your phone, not any other app, nothing else. It's already unreadable without the right passcode, so nothing accessible is being lost, but this makes that permanent and can't be undone.
            </p>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...primaryBtnSmall, background: red }} onClick={startFresh}>
                Erase and start fresh
              </button>
              <button
                onClick={() => setShowForgotPasscode(false)}
                style={{ background: "none", border: "none", color: inkSoft, fontSize: 13, cursor: "pointer" }}
              >
                Cancel
              </button>
            </div>
          </div>
        )}
      </Screen>
    );
  }

  // phase === "ready"
  return (
    <div style={{ background: paper, minHeight: "100vh", color: ink }}>
      <GlobalStyle />
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "20px 16px 80px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 18, flexWrap: "wrap", gap: 8 }}>
          <h1 style={{ fontSize: 26, fontWeight: 700, margin: 0, fontFamily: "Georgia, serif" }}>Care Log</h1>
          <div style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap" }}>
            <button
              onClick={() => setShowEmergencyResources((s) => !s)}
              style={{ ...linkBtnSmall, color: red, borderColor: red, fontWeight: 700 }}
            >
              Emergency Resources
            </button>
            <button style={linkBtnSmall} onClick={() => setShowSettings((s) => !s)}>Units</button>
            <button style={linkBtnSmall} onClick={() => setShowBackup((s) => !s)}>Backup</button>
            {(deletedEntries.length + deletedMeds.length + deletedFlaggedPeriods.length + deletedTreatments.length + deletedNotes.length > 0) && (
              <button style={linkBtnSmall} onClick={() => setShowRecentlyDeleted((s) => !s)}>
                Recently Deleted ({deletedEntries.length + deletedMeds.length + deletedFlaggedPeriods.length + deletedTreatments.length + deletedNotes.length})
              </button>
            )}
          </div>
        </div>

        {showRecentlyDeleted && (
          <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Recently deleted</div>
            <p style={{ fontSize: 12, color: inkSoft, margin: "0 0 10px" }}>
              Deleting never happens permanently by accident — anything you've deleted stays here until you restore it.
            </p>
            {deletedEntries.length === 0 && deletedMeds.length === 0 && deletedFlaggedPeriods.length === 0 && deletedTreatments.length === 0 && deletedNotes.length === 0 && (
              <div style={{ fontSize: 13, color: inkSoft }}>Nothing here right now.</div>
            )}
            {deletedEntries.map((e) => {
              const trackerName = trackers.find((t) => t.id === Object.keys(e.values)[0])?.name || "Deleted tracker";
              const trackerId = Object.keys(e.values)[0];
              const value = e.values[trackerId];
              return (
                <div key={e.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${paperDark}` }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{trackerName}</div>
                    <div style={{ fontSize: 12, color: inkSoft }}>
                      {typeof value === "boolean" ? (value ? "Present" : "Absent") : value} · {fmtTime(e.timestamp)}
                    </div>
                  </div>
                  <button style={primaryBtnSmall} onClick={() => restoreEntry(e.id)}>Restore</button>
                </div>
              );
            })}
            {deletedMeds.map((m) => (
              <div key={m.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${paperDark}` }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{medLabel(m)}</div>
                  <div style={{ fontSize: 12, color: inkSoft }}>{fmtTime(m.timestamp)}</div>
                </div>
                <button style={primaryBtnSmall} onClick={() => restoreMed(m.id)}>Restore</button>
              </div>
            ))}
            {deletedTreatments.map((t) => (
              <div key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${paperDark}` }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{medLabel(t)}</div>
                  <div style={{ fontSize: 12, color: inkSoft }}>{fmtTime(t.timestamp)}</div>
                </div>
                <button style={primaryBtnSmall} onClick={() => restoreTreatment(t.id)}>Restore</button>
              </div>
            ))}
            {deletedNotes.map((n) => (
              <div key={n.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${paperDark}` }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{n.text.length > 40 ? `${n.text.slice(0, 40)}…` : n.text}</div>
                  <div style={{ fontSize: 12, color: inkSoft }}>{fmtTime(n.timestamp)}</div>
                </div>
                <button style={primaryBtnSmall} onClick={() => restoreNote(n.id)}>Restore</button>
              </div>
            ))}
            {deletedFlaggedPeriods.map((p) => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${paperDark}` }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{p.label}</div>
                  <div style={{ fontSize: 12, color: inkSoft }}>{p.startDate}{p.endDate ? ` – ${p.endDate}` : " (ongoing)"}</div>
                </div>
                <button style={primaryBtnSmall} onClick={() => restoreFlaggedPeriod(p.id)}>Restore</button>
              </div>
            ))}
          </div>
        )}
        {showEmergencyResources && (
          <div style={{ background: redSoft, border: `1px solid ${red}`, borderRadius: 14, padding: 14, marginBottom: 18 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: red, marginBottom: 6 }}>Emergency Resources</div>
            <p style={{ fontSize: 13, color: ink, margin: 0 }}>
              This section is a placeholder — real resource information (crisis lines, poison control,
              and other emergency contacts) hasn't been added yet. Care Log is symptom-tracking software,
              not an emergency or crisis service; in an actual emergency, contact local emergency services directly.
            </p>
          </div>
        )}

        {showSettings && (
          <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Units</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button
                style={{ ...toggleBtn, ...(profile.unitSystem === "imperial" ? toggleBtnActive : {}) }}
                onClick={() => setProfile((p) => ({ ...p, unitSystem: "imperial" }))}
              >
                °F (imperial)
              </button>
              <button
                style={{ ...toggleBtn, ...(profile.unitSystem === "metric" ? toggleBtnActive : {}) }}
                onClick={() => setProfile((p) => ({ ...p, unitSystem: "metric" }))}
              >
                °C (metric)
              </button>
            </div>
          </div>
        )}

        {showBackup && (
          <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Back up your data</div>
            <p style={{ fontSize: 12, color: inkSoft, margin: "0 0 10px" }}>
              Saves an encrypted file, protected by your app passcode, that you can store anywhere or use to restore on another device.
            </p>
            <button style={primaryBtnSmall} onClick={handleExportBackup}>Download backup</button>

            <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${paperDark}` }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Restore from a backup</div>
              <p style={{ fontSize: 12, color: red, margin: "0 0 8px" }}>This replaces everything currently in the app — before it does, a snapshot of what's here now downloads automatically, so this can always be undone by restoring that file.</p>
              <input type="file" accept="application/json" onChange={(e) => setRestoreFile(e.target.files[0] || null)} style={{ ...inputStyle, marginBottom: 8 }} />
              <input type="password" placeholder="Backup passcode" value={restorePasscode} onChange={(e) => setRestorePasscode(e.target.value)} style={{ ...inputStyle, marginBottom: 8 }} />
              {restoreError && <div style={errorStyle}>{restoreError}</div>}
              {restoreSuccess && <div style={{ ...errorStyle, background: tealSoft, color: teal, borderColor: teal }}>Restored — a snapshot of your previous data was also saved to your downloads, in case you want to undo this.</div>}
              <button
                style={{ ...primaryBtnSmall, opacity: !restoreFile || !restorePasscode ? 0.5 : 1 }}
                disabled={!restoreFile || !restorePasscode}
                onClick={() => handleRestoreFromFile(restoreFile, restorePasscode, false)}
              >
                Restore this backup
              </button>
            </div>
          </div>
        )}

        {view === "templatePicker" ? (
          <TemplatePicker
            query={templateQuery}
            setQuery={setTemplateQuery}
            templates={filteredTemplates}
            remainingSlots={remainingSlots}
            openTemplateId={openTemplateId}
            openTemplate={openTemplate}
            selectedTrackerNames={selectedTrackerNames}
            toggleTrackerSelection={toggleTrackerSelection}
            addSelectedTrackers={addSelectedTrackers}
            onClose={() => { setView("dashboard"); setOpenTemplateId(null); setTemplateQuery(""); cancelCustomTrackerForm(); cancelPendingCustomTracker(); }}
            concerns={concerns}
            selectedConcernIds={selectedConcernIds}
            toggleConcernSelection={toggleConcernSelection}
            newConcernName={newConcernName}
            setNewConcernName={setNewConcernName}
            customDefs={filteredCustomDefs}
            selectExistingCustomDef={selectExistingCustomDef}
            selectQuestionnaire={selectQuestionnaire}
            showCustomTrackerForm={showCustomTrackerForm}
            startCustomTrackerFlow={startCustomTrackerFlow}
            cancelCustomTrackerForm={cancelCustomTrackerForm}
            customTrackerNameInput={customTrackerNameInput}
            setCustomTrackerNameInput={setCustomTrackerNameInput}
            customTrackerType={customTrackerType}
            setCustomTrackerType={setCustomTrackerType}
            confirmCustomTrackerDetails={confirmCustomTrackerDetails}
            pendingCustomTracker={pendingCustomTracker}
            cancelPendingCustomTracker={cancelPendingCustomTracker}
            addPendingCustomTracker={addPendingCustomTracker}
          />
        ) : activeTrackers.length === 0 ? (
          // First-run / zero-active-trackers state: nothing but the one action.
          <div style={{ display: "flex", justifyContent: "center", padding: "20vh 0" }}>
            <button style={bigTrackBtn} onClick={() => setView("templatePicker")}>
              <Plus size={22} style={{ marginRight: 8 }} /> Track a symptom
            </button>
          </div>
        ) : (
          <>
            <button style={{ ...secondaryTrackBtn, marginBottom: 14 }} onClick={() => setView("templatePicker")}>
              <Plus size={18} style={{ marginRight: 6 }} /> Track a symptom
            </button>

            {activeTrackers.length > 0 && chartDomain && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                {[
                  { key: "24h", label: "24h" },
                  { key: "3d", label: "3 days" },
                  { key: "7d", label: "7 days" },
                  { key: "all", label: "All" },
                ].map((r) => (
                  <button
                    key={r.key}
                    onClick={() => selectRangePreset(r.key)}
                    style={{
                      ...toggleBtn, flex: "0 0 auto", padding: "6px 12px", fontSize: 12,
                      ...(rangePreset === r.key && customViewDomain === null ? toggleBtnActive : {}),
                    }}
                  >
                    {r.label}
                  </button>
                ))}
                {isZoomed && (
                  <button onClick={resetView} style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                    Reset view
                  </button>
                )}
              </div>
            )}

            {(() => {
              const renderCard = (t, keySuffix) => (
                <TrackerCard
                  key={`${t.id}-${keySuffix}`}
                  tracker={t}
                  series={trackerSeries(t.id)}
                  latest={latestEntryFor(t.id)}
                  history={entriesForTracker(t.id)}
                  unitSystem={profile.unitSystem}
                  meds={activeMeds}
                  treatments={activeTreatments}
                  flaggedPeriods={activeFlaggedPeriods}
                  domain={chartDomain}
                  onViewChange={handleViewChange}
                  draftValue={draftValues[t.id]}
                  onDraftChange={(v) => setDraftValues((d) => ({ ...d, [t.id]: v }))}
                  onLog={(v, atTime) => logValue(t.id, v, t.type === "temperature", atTime)}
                  onArchive={() => archiveTracker(t.id)}
                  onUpdateEntry={(entryId, newValue, newTime) => updateEntryValue(entryId, t.id, newValue, newTime)}
                  onDeleteEntry={(entryId) => deleteEntryValue(entryId, t.id)}
                />
              );

              const concernGroups = concerns
                .map((c) => ({ ...c, trackers: activeTrackers.filter((t) => (t.concernIds || []).includes(c.id)) }))
                .filter((g) => g.trackers.length > 0);
              const ungrouped = activeTrackers.filter((t) => !(t.concernIds || []).length);

              if (concernGroups.length === 0) {
                // No concerns in use yet — the toggle would be pointless, just show the flat list.
                return activeTrackers.map((t) => renderCard(t, "flat"));
              }

              return (
                <>
                  <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                    <button
                      onClick={() => setDashboardViewMode("all")}
                      style={{ ...toggleBtn, padding: "6px 12px", fontSize: 12, ...(dashboardViewMode === "all" ? toggleBtnActive : {}) }}
                    >
                      All
                    </button>
                    <button
                      onClick={() => setDashboardViewMode("byConcern")}
                      style={{ ...toggleBtn, padding: "6px 12px", fontSize: 12, ...(dashboardViewMode === "byConcern" ? toggleBtnActive : {}) }}
                    >
                      By health concern
                    </button>
                  </div>

                  {dashboardViewMode === "all"
                    ? activeTrackers.map((t) => renderCard(t, "flat"))
                    : (
                      <>
                        {concernGroups.map((g) => {
                          const periodsForConcern = activeFlaggedPeriods.filter((p) => p.concernId === g.id);
                          return (
                            <div key={g.id} style={{ marginBottom: 16 }}>
                              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                                <div style={{ fontSize: 14, fontWeight: 700, color: inkSoft, textTransform: "uppercase", letterSpacing: 0.4 }}>
                                  {g.name}
                                </div>
                                <button
                                  onClick={() => openMarkPeriodForm(g.id)}
                                  style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, cursor: "pointer" }}
                                >
                                  + Mark a period
                                </button>
                              </div>

                              {periodsForConcern.length > 0 && (
                                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
                                  {periodsForConcern.map((p) => (
                                    <span
                                      key={p.id}
                                      style={{
                                        display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12,
                                        background: amberSoft, color: ink, padding: "4px 8px", borderRadius: 999,
                                      }}
                                    >
                                      <strong>{p.label}</strong>: {p.startDate}{p.endDate ? ` – ${p.endDate}` : " (ongoing)"}
                                      <button
                                        aria-label={`Remove ${p.label} period`}
                                        onClick={() => deleteFlaggedPeriod(p.id)}
                                        style={{ background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", color: inkSoft }}
                                      >
                                        <X size={12} />
                                      </button>
                                    </span>
                                  ))}
                                </div>
                              )}

                              {markPeriodConcernId === g.id && (
                                <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 12, padding: 12, marginBottom: 10 }}>
                                  <label style={{ fontSize: 12, fontWeight: 600, color: inkSoft, display: "block", marginBottom: 4 }}>Label</label>
                                  <input
                                    value={periodLabelInput}
                                    onChange={(e) => setPeriodLabelInput(e.target.value)}
                                    placeholder="Relapse, flare-up, etc."
                                    style={{ ...inputStyle, fontSize: 13, padding: "8px 10px", marginBottom: 8 }}
                                  />
                                  <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                                    <div style={{ flex: 1 }}>
                                      <label style={{ fontSize: 12, fontWeight: 600, color: inkSoft, display: "block", marginBottom: 4 }}>Start</label>
                                      <input
                                        type="date"
                                        value={periodStartInput}
                                        onChange={(e) => setPeriodStartInput(e.target.value)}
                                        style={{ ...inputStyle, fontSize: 13, padding: "8px 10px" }}
                                      />
                                    </div>
                                    <div style={{ flex: 1 }}>
                                      <label style={{ fontSize: 12, fontWeight: 600, color: inkSoft, display: "block", marginBottom: 4 }}>End (optional)</label>
                                      <input
                                        type="date"
                                        value={periodEndInput}
                                        onChange={(e) => setPeriodEndInput(e.target.value)}
                                        style={{ ...inputStyle, fontSize: 13, padding: "8px 10px" }}
                                      />
                                    </div>
                                  </div>
                                  <div style={{ display: "flex", gap: 8 }}>
                                    <button
                                      style={{ ...primaryBtnSmall, opacity: periodLabelInput.trim() && periodStartInput ? 1 : 0.5 }}
                                      disabled={!periodLabelInput.trim() || !periodStartInput}
                                      onClick={addFlaggedPeriod}
                                    >
                                      Save
                                    </button>
                                    <button onClick={cancelMarkPeriodForm} style={{ background: "none", border: "none", color: inkSoft, fontSize: 13, cursor: "pointer" }}>
                                      Cancel
                                    </button>
                                  </div>
                                </div>
                              )}

                              {g.trackers.map((t) => renderCard(t, g.id))}

                              {(() => {
                                const concernMedNames = [...new Set(activeMeds.filter((m) => (m.concernIds || []).includes(g.id)).map((m) => m.name))];
                                const concernTreatmentNames = [...new Set(activeTreatments.filter((tr) => (tr.concernIds || []).includes(g.id)).map((tr) => tr.name))];
                                const concernNoteCount = activeNotes.filter((n) => (n.concernIds || []).includes(g.id)).length;
                                if (concernMedNames.length === 0 && concernTreatmentNames.length === 0 && concernNoteCount === 0) return null;
                                return (
                                  <div style={{ fontSize: 12, color: inkSoft, marginTop: 4, marginBottom: 4 }}>
                                    {concernMedNames.length > 0 && <div>Medications: {concernMedNames.join(", ")}</div>}
                                    {concernTreatmentNames.length > 0 && <div>Treatments: {concernTreatmentNames.join(", ")}</div>}
                                    {concernNoteCount > 0 && <div>Notes: {concernNoteCount}</div>}
                                  </div>
                                );
                              })()}
                            </div>
                          );
                        })}
                        {ungrouped.length > 0 && (
                          <div>
                            <div style={{ fontSize: 14, fontWeight: 700, color: inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8 }}>
                              Other
                            </div>
                            {ungrouped.map((t) => renderCard(t, "other"))}
                          </div>
                        )}
                      </>
                    )}
                </>
              );
            })()}

            <MedicationSection
              meds={activeMeds}
              medName={medName}
              setMedName={setMedName}
              medDose={medDose}
              setMedDose={setMedDose}
              onAdd={addMedication}
              onDelete={deleteMed}
              onUpdate={updateMed}
              catalogCount={medCatalogCount}
              knownMedNames={knownMedNames}
              concerns={concerns}
            />

            <TreatmentSection
              treatments={activeTreatments}
              treatmentName={treatmentName}
              setTreatmentName={setTreatmentName}
              treatmentDetail={treatmentDetail}
              setTreatmentDetail={setTreatmentDetail}
              treatmentMedNames={treatmentMedNames}
              toggleTreatmentMedName={toggleTreatmentMedName}
              treatmentNewMedName={treatmentNewMedName}
              setTreatmentNewMedName={setTreatmentNewMedName}
              knownMedicationNames={distinctMedNamesDisplay}
              onAdd={addTreatment}
