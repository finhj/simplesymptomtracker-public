              onDelete={deleteTreatment}
              onUpdate={updateTreatment}
              concerns={concerns}
            />

            <NoteSection
              notes={activeNotes}
              noteText={noteText}
              setNoteText={setNoteText}
              noteConcernIds={noteConcernIds}
              toggleNoteConcern={toggleNoteConcern}
              noteNewConcernName={noteNewConcernName}
              setNoteNewConcernName={setNoteNewConcernName}
              onAdd={addNote}
              onDelete={deleteNote}
              onUpdate={updateNote}
              concerns={concerns}
            />

            <ReportSection
              show={showReport}
              setShow={setShowReport}
              text={reportText}
              onCopy={copyReport}
              copied={reportCopied}
            />
          </>
        )}

        {saveError && (
          <div style={{ ...errorStyle, marginTop: 16 }}>
            Couldn't save changes — your entries are still here in this session, but retry saving before closing the app.
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Subcomponents ----------

function Screen({ title, children }) {
  return (
    <div style={{ background: paper, minHeight: "100vh", color: ink, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <GlobalStyle />
      <div style={{ width: "100%", maxWidth: 380, padding: "0 20px" }}>
        <h1 style={{ fontSize: 22, fontWeight: 700, marginBottom: 16, fontFamily: "Georgia, serif" }}>{title}</h1>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: inkSoft, marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.4 }}>
        {label}
      </label>
      {children}
    </div>
  );
}

function TrackerCard({ tracker, series, latest, history, unitSystem, meds, treatments, flaggedPeriods, domain, onViewChange, draftValue, onDraftChange, onLog, onArchive, onUpdateEntry, onDeleteEntry }) {
  const unitLabel = tracker.type === "temperature" ? tempUnitLabel(unitSystem) : null;
  const [customTime, setCustomTime] = useState(null); // null = log at "now" (the fast default)
  const [showHistory, setShowHistory] = useState(false);
  const [showAllHistory, setShowAllHistory] = useState(false);
  const [editingEntryId, setEditingEntryId] = useState(null);
  const [editValue, setEditValue] = useState(undefined);
  const [editTime, setEditTime] = useState("");
  const [showQuestionnaireForm, setShowQuestionnaireForm] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const logAt = (value) => onLog(value, customTime);

  function startEdit(entry) {
    setEditingEntryId(entry.id);
    setEditValue(entry.value);
    setEditTime(isoToLocalInput(entry.timestamp));
  }
  function cancelEdit() {
    setEditingEntryId(null);
    setEditValue(undefined);
    setEditTime("");
  }
  function saveEdit() {
    if (editValue === undefined || editValue === "") return;
    const value = tracker.type === "boolean" ? editValue : Number(editValue);
    onUpdateEntry(editingEntryId, value, editTime);
    cancelEdit();
  }
  function formatValue(v) {
    if (tracker.type === "questionnaire") return `${v.score}/${tracker.scaleMax} (${v.band})`;
    if (typeof v === "boolean") return v ? "Present" : "Absent";
    if (tracker.type === "temperature") return `${displayTemp(v, unitSystem).toFixed(1)}${unitLabel}`;
    return `${v}`;
  }
  const lastSummary = latest ? `${formatValue(latest.values[tracker.id])}${unitLabel || ""} · ${fmtTimeShort(latest.timestamp)}` : "No readings yet";

  const historyShown = showAllHistory ? history : history.slice(0, 6);

  return (
    <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 14, marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: collapsed ? 0 : 8 }}>
        <button
          onClick={() => setCollapsed((c) => !c)}
          style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", padding: 0, cursor: "pointer", textAlign: "left" }}
        >
          <ChevronLeft size={16} color={inkSoft} style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(-90deg) scaleY(-1)", flexShrink: 0 }} />
          <div>
            <div style={{ fontSize: 16, fontWeight: 700 }}>{tracker.name}</div>
            {collapsed && <div style={{ fontSize: 12, color: inkSoft }}>{lastSummary}</div>}
          </div>
        </button>
        <button aria-label={`Archive ${tracker.name}`} onClick={onArchive} style={iconBtn}>
          <Trash2 size={16} color={inkSoft} />
        </button>
      </div>

      {!collapsed && (
      <>
      <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
        <Sparkline points={series} kind={tracker.type} unitSystem={unitSystem} scaleMax={tracker.scaleMax} meds={tracker.type !== "boolean" ? meds : null} treatments={tracker.type !== "boolean" ? treatments : null} flaggedPeriods={flaggedPeriods} domain={domain} onViewChange={onViewChange} />
        <div style={{ flex: 1, minWidth: 140 }}>
          {tracker.type === "temperature" && (
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input
                type="number"
                inputMode="decimal"
                step="0.1"
                placeholder={unitSystem === "imperial" ? "98.6" : "37.0"}
                value={draftValue ?? ""}
                onChange={(e) => onDraftChange(e.target.value === "" ? "" : parseFloat(e.target.value))}
                style={{ ...inputStyle, width: 90 }}
              />
              <span style={{ fontSize: 13, color: inkSoft }}>{unitLabel}</span>
              <button style={primaryBtnSmall} onClick={() => draftValue !== undefined && draftValue !== "" && logAt(draftValue)}>
                Log
              </button>
            </div>
          )}
          {tracker.type === "number" && (
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input
                type="number"
                inputMode="decimal"
                step="any"
                placeholder="0"
                value={draftValue ?? ""}
                onChange={(e) => onDraftChange(e.target.value === "" ? "" : parseFloat(e.target.value))}
                style={{ ...inputStyle, width: 90 }}
              />
              <button style={primaryBtnSmall} onClick={() => draftValue !== undefined && draftValue !== "" && logAt(draftValue)}>
                Log
              </button>
            </div>
          )}
          {tracker.type === "scale" && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {Array.from({ length: (tracker.scaleMax || 5) + 1 }, (_, n) => n).map((n) => (
                <button key={n} style={scaleBtn} onClick={() => logAt(n)}>{n}</button>
              ))}
            </div>
          )}
          {tracker.type === "boolean" && (
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...scaleBtn, width: "auto", padding: "8px 14px" }} onClick={() => logAt(true)}>Present</button>
              <button style={{ ...scaleBtn, width: "auto", padding: "8px 14px" }} onClick={() => logAt(false)}>Absent</button>
            </div>
          )}
          {tracker.type === "questionnaire" && (() => {
            const questionnaire = QUESTIONNAIRES.find((q) => q.id === tracker.questionnaireId);
            if (!questionnaire) return <div style={{ fontSize: 12, color: red }}>Questionnaire not found.</div>;
            return showQuestionnaireForm ? (
              <QuestionnaireForm
                questionnaire={questionnaire}
                onCancel={() => setShowQuestionnaireForm(false)}
                onSubmit={(responses) => {
                  const { score, band } = scoreQuestionnaire(questionnaire, responses);
                  onLog({ score, band, responses }, null);
                  setShowQuestionnaireForm(false);
                }}
              />
            ) : (
              <button style={primaryBtnSmall} onClick={() => setShowQuestionnaireForm(true)}>
                Take questionnaire
              </button>
            );
          })()}

          {tracker.type !== "questionnaire" && (customTime === null ? (
            <button
              onClick={() => setCustomTime(nowForInput())}
              style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: "6px 0 0", cursor: "pointer" }}
            >
              Log for a different time
            </button>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6 }}>
              <input
                type="datetime-local"
                value={customTime}
                onChange={(e) => setCustomTime(e.target.value)}
                style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, flex: 1 }}
              />
              <button onClick={() => setCustomTime(null)} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>
                Use now
              </button>
            </div>
          ))}

          {latest && (
            <div style={{ fontSize: 12, color: inkSoft, marginTop: 6 }}>
              Last: {tracker.type === "questionnaire"
                ? `${latest.values[tracker.id].score}/${tracker.scaleMax} (${latest.values[tracker.id].band})`
                : typeof latest.values[tracker.id] === "boolean"
                  ? (latest.values[tracker.id] ? "Present" : "Absent")
                  : tracker.type === "temperature"
                    ? displayTemp(latest.values[tracker.id], unitSystem).toFixed(1)
                    : latest.values[tracker.id]}
              {unitLabel || ""} · {fmtTimeShort(latest.timestamp)}
            </div>
          )}
        </div>
      </div>

      {history.length > 0 && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${paperDark}` }}>
          <button
            onClick={() => setShowHistory((s) => !s)}
            style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: 0, cursor: "pointer" }}
          >
            {showHistory ? "Hide history" : `History (${history.length})`}
          </button>

          {showHistory && (
            <div style={{ marginTop: 8 }}>
              {historyShown.map((entry) => (
                <div key={entry.id} style={{ padding: "6px 0", borderBottom: `1px solid ${paperDark}` }}>
                  {tracker.type === "questionnaire" ? (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", fontSize: 13 }}>
                      <span>{formatValue(entry.value)}</span>
                      <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <span style={{ color: inkSoft }}>{fmtTime(entry.timestamp)}</span>
                        <button
                          aria-label="Delete this questionnaire result"
                          onClick={() => onDeleteEntry(entry.id)}
                          style={{ background: "none", border: "none", color: red, fontSize: 12, cursor: "pointer" }}
                        >
                          Delete
                        </button>
                      </span>
                    </div>
                  ) : editingEntryId === entry.id ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {tracker.type === "temperature" && (
                        <input
                          type="number" inputMode="decimal" step="0.1"
                          value={editValue ?? ""}
                          onChange={(e) => setEditValue(e.target.value)}
                          style={{ ...inputStyle, padding: "6px 8px", fontSize: 13, width: 90 }}
                        />
                      )}
                      {tracker.type === "number" && (
                        <input
                          type="number" inputMode="decimal" step="any"
                          value={editValue ?? ""}
                          onChange={(e) => setEditValue(e.target.value)}
                          style={{ ...inputStyle, padding: "6px 8px", fontSize: 13, width: 90 }}
                        />
                      )}
                      {tracker.type === "scale" && (
                        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                          {Array.from({ length: (tracker.scaleMax || 5) + 1 }, (_, n) => n).map((n) => (
                            <button
                              key={n}
                              onClick={() => setEditValue(n)}
                              style={{
                                ...scaleBtn, width: 30, height: 30, fontSize: 12,
                                background: editValue === n ? teal : paper,
                                color: editValue === n ? "white" : ink,
                                borderColor: editValue === n ? teal : border,
                              }}
                            >
                              {n}
                            </button>
                          ))}
                        </div>
                      )}
                      {tracker.type === "boolean" && (
                        <div style={{ display: "flex", gap: 6 }}>
                          <button
                            onClick={() => setEditValue(true)}
                            style={{ ...scaleBtn, width: "auto", padding: "6px 10px", fontSize: 12, background: editValue === true ? teal : paper, color: editValue === true ? "white" : ink, borderColor: editValue === true ? teal : border }}
                          >
                            Present
                          </button>
                          <button
                            onClick={() => setEditValue(false)}
                            style={{ ...scaleBtn, width: "auto", padding: "6px 10px", fontSize: 12, background: editValue === false ? teal : paper, color: editValue === false ? "white" : ink, borderColor: editValue === false ? teal : border }}
                          >
                            Absent
                          </button>
                        </div>
                      )}
                      <input
                        type="datetime-local"
                        value={editTime}
                        onChange={(e) => setEditTime(e.target.value)}
                        style={{ ...inputStyle, padding: "6px 8px", fontSize: 12 }}
                      />
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={saveEdit} style={{ ...primaryBtnSmall, padding: "6px 12px", fontSize: 12 }}>Save</button>
                        <button onClick={cancelEdit} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                        <button
                          onClick={() => { onDeleteEntry(entry.id); cancelEdit(); }}
                          style={{ background: "none", border: "none", color: red, fontSize: 12, cursor: "pointer", marginLeft: "auto" }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ) : (
                    <button
                      onClick={() => startEdit(entry)}
                      style={{ display: "flex", justifyContent: "space-between", width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 13 }}
                    >
                      <span>{formatValue(entry.value)}</span>
                      <span style={{ color: inkSoft }}>{fmtTime(entry.timestamp)}</span>
                    </button>
                  )}
                </div>
              ))}
              {!showAllHistory && history.length > 6 && (
                <button
                  onClick={() => setShowAllHistory(true)}
                  style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: "6px 0 0", cursor: "pointer" }}
                >
                  Show {history.length - 6} more
                </button>
              )}
            </div>
          )}
        </div>
      )}
      </>
      )}
    </div>
  );
}

function QuestionnaireForm({ questionnaire, onSubmit, onCancel }) {
  const [responses, setResponses] = useState({});
  const allAnswered = questionnaire.questions.every((q) => responses[q.id] !== undefined);

  return (
    <div style={{ background: paper, border: `1px solid ${border}`, borderRadius: 12, padding: 12, marginTop: 8 }}>
      {questionnaire.questions.map((q, i) => (
        <div key={q.id} style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>
            {i + 1}. {q.text}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {questionnaire.scale.labels.map((label, val) => (
              <button
                key={val}
                onClick={() => setResponses((prev) => ({ ...prev, [q.id]: val }))}
                style={{
                  ...toggleBtn, textAlign: "left", padding: "8px 10px", fontSize: 12,
                  ...(responses[q.id] === val ? toggleBtnActive : {}),
                }}
              >
                {label}
              </button>
            ))}
          </div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 8 }}>
        <button
          style={{ ...primaryBtnSmall, opacity: allAnswered ? 1 : 0.5 }}
          disabled={!allAnswered}
          onClick={() => onSubmit(responses)}
        >
          Submit
        </button>
        <button onClick={onCancel} style={{ background: "none", border: "none", color: inkSoft, fontSize: 13, cursor: "pointer" }}>
          Cancel
        </button>
      </div>
    </div>
  );
}

function ConcernPicker({ concerns, selectedConcernIds, toggleConcernSelection, newConcernName, setNewConcernName }) {
  return (
    <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${paperDark}` }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Health concern (optional)</div>
      <p style={{ fontSize: 12, color: inkSoft, margin: "0 0 8px" }}>
        Group this under a concern so you can view it together with related trackers — a symptom can belong to more than one.
      </p>
      {concerns.length > 0 && (
        <div style={{ marginBottom: 8 }}>
          {concerns.map((c) => (
            <label key={c.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 2px", cursor: "pointer" }}>
              <input
                type="checkbox"
                checked={selectedConcernIds.includes(c.id)}
                onChange={() => toggleConcernSelection(c.id)}
                style={{ width: 18, height: 18, accentColor: teal }}
              />
              <span style={{ fontSize: 14 }}>{c.name}</span>
            </label>
          ))}
        </div>
      )}
      <input
        placeholder="New concern, e.g. Cold / Flu"
        value={newConcernName}
        onChange={(e) => setNewConcernName(e.target.value)}
        style={{ ...inputStyle, fontSize: 13, padding: "8px 10px" }}
      />
    </div>

}

function TemplatePicker({
  query, setQuery, templates, remainingSlots, openTemplateId, openTemplate, selectedTrackerNames, toggleTrackerSelection, addSelectedTrackers, onClose,
  concerns, selectedConcernIds, toggleConcernSelection, newConcernName, setNewConcernName,
  customDefs, selectExistingCustomDef, selectQuestionnaire,
  showCustomTrackerForm, startCustomTrackerFlow, cancelCustomTrackerForm,
  customTrackerNameInput, setCustomTrackerNameInput, customTrackerType, setCustomTrackerType, confirmCustomTrackerDetails,
  pendingCustomTracker, cancelPendingCustomTracker, addPendingCustomTracker,
}) {
  const activeTemplate = templates.find((t) => t.id === openTemplateId) || TEMPLATES.find((t) => t.id === openTemplateId);

  // ---------- Custom tracker: name + type form ----------
  if (showCustomTrackerForm) {
    const TYPE_OPTIONS = [
      { key: "scale", label: "Rate severity (0–5)" },
      { key: "boolean", label: "Yes / No" },
      { key: "number", label: "Number" },
    ];
    return (
      <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <button aria-label="Back" style={iconBtn} onClick={cancelCustomTrackerForm}>
            <ChevronLeft size={20} />
          </button>
          <div style={{ fontSize: 18, fontWeight: 700 }}>Custom symptom</div>
        </div>
        <div style={{ marginTop: 12 }}>
          <label style={{ fontSize: 13, fontWeight: 700, display: "block", marginBottom: 6 }}>Name</label>
          <input
            placeholder="e.g. Joint pain"
            value={customTrackerNameInput}
            onChange={(e) => setCustomTrackerNameInput(e.target.value)}
            style={{ ...inputStyle, marginBottom: 14 }}
            autoFocus
          />
          <label style={{ fontSize: 13, fontWeight: 700, display: "block", marginBottom: 6 }}>How should this be logged?</label>
          {TYPE_OPTIONS.map((opt) => (
            <label key={opt.key} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 4px", borderBottom: `1px solid ${paperDark}`, cursor: "pointer" }}>
              <input
                type="radio"
                name="customTrackerType"
                checked={customTrackerType === opt.key}
                onChange={() => setCustomTrackerType(opt.key)}
                style={{ width: 18, height: 18, accentColor: teal }}
              />
              <span style={{ fontSize: 15 }}>{opt.label}</span>
            </label>
          ))}
        </div>
        <button
          style={{ ...primaryBtn, marginTop: 16, opacity: customTrackerNameInput.trim() ? 1 : 0.5 }}
          disabled={!customTrackerNameInput.trim()}
          onClick={confirmCustomTrackerDetails}
        >
          Continue
        </button>
      </div>
    );
  }

  // ---------- Custom tracker (new or reused): concern step + add ----------
  if (pendingCustomTracker) {
    const overLimit = remainingSlots <= 0;
    return (
      <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <button aria-label="Back" style={iconBtn} onClick={cancelPendingCustomTracker}>
            <ChevronLeft size={20} />
          </button>
          <div style={{ fontSize: 18, fontWeight: 700 }}>{pendingCustomTracker.name}</div>
        </div>
        <ConcernPicker
          concerns={concerns}
          selectedConcernIds={selectedConcernIds}
          toggleConcernSelection={toggleConcernSelection}
          newConcernName={newConcernName}
          setNewConcernName={setNewConcernName}
        />
        {overLimit && (
          <div style={{ ...errorStyle, marginTop: 10 }}>
            You've reached the free plan's {MAX_TRACKERS}-tracker limit. Archive an existing tracker to add a new one.
          </div>
        )}
        <button
          style={{ ...primaryBtn, marginTop: 14, opacity: overLimit ? 0.5 : 1 }}
          disabled={overLimit}
          onClick={addPendingCustomTracker}
        >
          Add tracker
        </button>
      </div>
    );
  }

  // ---------- Official template: tracker checklist + concern step ----------
  if (openTemplateId && activeTemplate) {
    const overLimit = selectedTrackerNames.length > remainingSlots;
    return (
      <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <button aria-label="Back" style={iconBtn} onClick={() => openTemplate(null)}>
            <ChevronLeft size={20} />
          </button>
          <div style={{ fontSize: 18, fontWeight: 700 }}>{activeTemplate.label}</div>
        </div>
        <p style={{ fontSize: 13, color: inkSoft, margin: "4px 0 12px" }}>Choose which to track — up to {remainingSlots} on the free plan.</p>
        {activeTemplate.trackers.map((tr) => {
          const checked = selectedTrackerNames.includes(tr.name);
          return (
            <label key={tr.name} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 4px", borderBottom: `1px solid ${paperDark}`, cursor: "pointer" }}>
              <input type="checkbox" checked={checked} onChange={() => toggleTrackerSelection(tr.name)} style={{ width: 20, height: 20, accentColor: teal }} />
              <span style={{ fontSize: 15 }}>{tr.name}</span>
            </label>
          );
        })}

        <ConcernPicker
          concerns={concerns}
          selectedConcernIds={selectedConcernIds}
          toggleConcernSelection={toggleConcernSelection}
          newConcernName={newConcernName}
          setNewConcernName={setNewConcernName}
        />

        {overLimit && (
          <div style={{ ...errorStyle, marginTop: 10 }}>
            Free plan: {remainingSlots} tracker{remainingSlots === 1 ? "" : "s"} available — uncheck one to continue.
          </div>
        )}
        {remainingSlots === 0 && (
          <div style={{ ...errorStyle, marginTop: 10 }}>
            You've reached the free plan's {MAX_TRACKERS}-tracker limit. Archive an existing tracker to add a new one.
          </div>
        )}
        <button
          style={{ ...primaryBtn, marginTop: 14, opacity: selectedTrackerNames.length === 0 || overLimit || remainingSlots === 0 ? 0.5 : 1 }}
          disabled={selectedTrackerNames.length === 0 || overLimit || remainingSlots === 0}
          onClick={addSelectedTrackers}
        >
          Add {selectedTrackerNames.length || ""} tracker{selectedTrackerNames.length === 1 ? "" : "s"}
        </button>
      </div>
    );
  }

  // ---------- Browse: search, "Your trackers", official templates, add-custom ----------
  const noMatches = templates.length === 0 && customDefs.length === 0;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <button aria-label="Close" style={iconBtn} onClick={onClose}>
          <X size={20} />
        </button>
        <div style={{ fontSize: 18, fontWeight: 700 }}>Track a symptom</div>
      </div>
      <div style={{ position: "relative", marginBottom: 14 }}>
        <Search size={16} color={inkSoft} style={{ position: "absolute", left: 12, top: 14 }} />
        <input
          placeholder="Search — cough, rash, headache..."
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          style={{ ...inputStyle, paddingLeft: 34 }}
          autoFocus
        />
      </div>

      {customDefs.length > 0 && (
        <>
          <div style={{ fontSize: 12, fontWeight: 700, color: inkSoft, textTransform: "uppercase", letterSpacing: 0.4, margin: "0 0 8px" }}>
            Your trackers
          </div>
          {customDefs.map((d) => (
            <button key={d.id} style={templateRow} onClick={() => selectExistingCustomDef(d)}>
              <div style={{ fontSize: 15, fontWeight: 700 }}>{d.name}</div>
              <div style={{ fontSize: 12, color: inkSoft, marginTop: 2 }}>
                {d.type === "scale" ? `Severity 0–${d.scaleMax || 5}` : d.type === "boolean" ? "Yes / No" : "Number"}
              </div>
            </button>
          ))}
        </>
      )}

      {availableQuestionnaires.length > 0 && (
        <>
          <div style={{ fontSize: 12, fontWeight: 700, color: inkSoft, textTransform: "uppercase", letterSpacing: 0.4, margin: "14px 0 8px" }}>
            Questionnaires
          </div>
          {availableQuestionnaires.map((q) => (
            <button key={q.id} style={templateRow} onClick={() => selectQuestionnaire(q)}>
              <div style={{ fontSize: 15, fontWeight: 700 }}>{q.name}</div>
              <div style={{ fontSize: 12, color: inkSoft, marginTop: 2 }}>{q.description}</div>
            </button>
          ))}
        </>
      )}

      {CATEGORY_ORDER.map((cat) => {
        const inCategory = templates.filter((t) => (t.category || []).includes(cat));
        if (inCategory.length === 0) return null;
        return (
          <div key={cat}>
            <div style={{ fontSize: 12, fontWeight: 700, color: inkSoft, textTransform: "uppercase", letterSpacing: 0.4, margin: "14px 0 8px" }}>
              {cat}
            </div>
            {inCategory.map((t) => (
              <button key={`${cat}-${t.id}`} style={templateRow} onClick={() => openTemplate(t.id)}>
                <div style={{ fontSize: 15, fontWeight: 700 }}>{t.label}</div>
                <div style={{ fontSize: 12, color: inkSoft, marginTop: 2 }}>{t.description}</div>
              </button>
            ))}
          </div>
        );
      })}

      {noMatches && query.trim() ? (
        <button style={templateRow} onClick={() => startCustomTrackerFlow(query.trim())}>
          <div style={{ fontSize: 15, fontWeight: 700, color: blue }}>No matches for "{query.trim()}"</div>
          <div style={{ fontSize: 12, color: inkSoft, marginTop: 2 }}>Track it as a custom symptom instead</div>
        </button>
      ) : (
        <button
          onClick={() => startCustomTrackerFlow("")}
          style={{ ...linkBtn, marginTop: 10, background: "none", textAlign: "center" }}
        >
          Don't see it? Add a custom symptom
        </button>
      )}
    </div>
  );
}

function MedicationSection({ meds, medName, setMedName, medDose, setMedDose, onAdd, onDelete, onUpdate, catalogCount, knownMedNames, concerns }) {
  const sorted = [...meds].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 6);
  const grouped = groupMedsByDisplayTime(sorted);
  const isNewDistinct = medName.trim() && !knownMedNames.includes(medName.trim().toLowerCase());
  const atCap = isNewDistinct && catalogCount >= MAX_MEDICATIONS;
  const [customTime, setCustomTime] = useState(null); // null = log at "now" (the fast default)
  const [editingMedId, setEditingMedId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editDose, setEditDose] = useState("");
  const [editTime, setEditTime] = useState("");
  const [collapsed, setCollapsed] = useState(false);
  const [medConcernIds, setMedConcernIds] = useState([]);
  const [medNewConcernName, setMedNewConcernName] = useState("");
  const [editConcernIds, setEditConcernIds] = useState([]);
  const [editNewConcernName, setEditNewConcernName] = useState("");

  function toggleMedConcern(id) {
    setMedConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }
  function toggleEditMedConcern(id) {
    setEditConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }
  function startEdit(m) {
    setEditingMedId(m.id);
    setEditName(m.name);
    setEditDose(m.dose || "");
    setEditTime(isoToLocalInput(m.timestamp));
    setEditConcernIds(m.concernIds || []);
    setEditNewConcernName("");
  }
  function cancelEdit() {
    setEditingMedId(null);
    setEditName("");
    setEditDose("");
    setEditTime("");
    setEditConcernIds([]);
    setEditNewConcernName("");
  }
  function saveEdit() {
    if (!editName.trim()) return;
    onUpdate(editingMedId, editName.trim(), editDose.trim(), editTime, editConcernIds, editNewConcernName);
    cancelEdit();
  }

  return (
    <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 14, marginTop: 20, marginBottom: 16 }}>
      <button
        onClick={() => setCollapsed((c) => !c)}

          setMedNewConcernName("");

        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${paperDark}` }}>

            <div key={g.label + g.items[0].id} style={{ padding: "6px 0" }}>
              <div style={{ color: inkSoft, fontSize: 12, marginBottom: 2 }}>{g.label}</div>

function TreatmentSection({
  treatments, treatmentName, setTreatmentName, treatmentDetail, setTreatmentDetail,
  treatmentMedNames, toggleTreatmentMedName, treatmentNewMedName, setTreatmentNewMedName, knownMedicationNames,
  onAdd, onDelete, onUpdate, concerns,
}) {
  const sorted = [...treatments].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 6);
  const grouped = groupMedsByDisplayTime(sorted); // same time-grouping helper works for any {name, dose, timestamp}-shaped item
  const [customTime, setCustomTime] = useState(null); // null = log at "now" (the fast default)
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editDetail, setEditDetail] = useState("");
  const [editTime, setEditTime] = useState("");
  const [editMedNames, setEditMedNames] = useState([]);
  const [editNewMedName, setEditNewMedName] = useState("");
  const [collapsed, setCollapsed] = useState(false);
  const [treatmentConcernIds, setTreatmentConcernIds] = useState([]);
  const [treatmentNewConcernName, setTreatmentNewConcernName] = useState("");
  const [editConcernIds, setEditConcernIds] = useState([]);
  const [editNewConcernName, setEditNewConcernName] = useState("");

  function toggleTreatmentConcern(id) {
    setTreatmentConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }
  function toggleEditConcern(id) {
    setEditConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }
  function startEdit(t) {
    setEditingId(t.id);
    setEditName(t.name);
    setEditDetail(t.dose || "");
    setEditTime(isoToLocalInput(t.timestamp));
    setEditMedNames(t.medicationNames || []);
    setEditNewMedName("");
    setEditConcernIds(t.concernIds || []);
    setEditNewConcernName("");
  }
  function cancelEdit() {
    setEditingId(null);
    setEditName("");
    setEditDetail("");
    setEditTime("");
    setEditMedNames([]);
    setEditNewMedName("");
    setEditConcernIds([]);
    setEditNewConcernName("");
  }
  function toggleEditMedName(name) {
    setEditMedNames((prev) => (prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]));
  }
  function saveEdit() {
    if (!editName.trim()) return;
    const typed = editNewMedName.trim();
    const finalNames = [...editMedNames];
    if (typed && !finalNames.some((n) => n.toLowerCase() === typed.toLowerCase())) finalNames.push(typed);
    onUpdate(editingId, editName.trim(), editDetail.trim(), editTime, finalNames, editConcernIds, editNewConcernName);
    cancelEdit();
  }

  const medPickerChip = (name, checked, onToggle) => (
    <button
      key={name}
      onClick={onToggle}
      style={{
        ...toggleBtn, padding: "5px 10px", fontSize: 12,
        ...(checked ? toggleBtnActive : {}),
      }}
    >
      {name}
    </button>
  );

  return (
    <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 14, marginTop: 20, marginBottom: 16 }}>
      <button
        onClick={() => setCollapsed((c) => !c)}
        style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", padding: 0, cursor: "pointer", marginBottom: collapsed ? 0 : 4 }}
      >
        <ChevronLeft size={16} color={inkSoft} style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(-90deg) scaleY(-1)", flexShrink: 0 }} />
        <div style={{ fontSize: 16, fontWeight: 700 }}>Treatments{collapsed && treatments.length > 0 ? ` (${treatments.length})` : ""}</div>
      </button>
      {!collapsed && (
      <>
      <p style={{ fontSize: 12, color: inkSoft, margin: "0 0 10px" }}>
        ECT, ketamine or chemo infusions, physical therapy, or anything else administered rather than self-taken.
      </p>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <input placeholder="Physical therapy" value={treatmentName} onChange={(e) => setTreatmentName(e.target.value)} style={{ ...inputStyle, flex: 1.4 }} />
        <input placeholder="Detail (optional)" value={treatmentDetail} onChange={(e) => setTreatmentDetail(e.target.value)} style={{ ...inputStyle, flex: 1 }} />
      </div>

      <div style={{ marginBottom: 8 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: inkSoft, marginBottom: 4 }}>Medications given (optional)</div>
        {knownMedicationNames.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 6 }}>
            {knownMedicationNames.map((name) =>
              medPickerChip(name, treatmentMedNames.includes(name), () => toggleTreatmentMedName(name))
            )}
          </div>
        )}
        <input
          placeholder="New medication name"
          value={treatmentNewMedName}
          onChange={(e) => setTreatmentNewMedName(e.target.value)}
          style={{ ...inputStyle, fontSize: 13, padding: "6px 8px" }}
        />
      </div>

      <ConcernPicker
        concerns={concerns}
        selectedConcernIds={treatmentConcernIds}
        toggleConcernSelection={toggleTreatmentConcern}
        newConcernName={treatmentNewConcernName}
        setNewConcernName={setTreatmentNewConcernName}
      />

      {customTime === null ? (
        <button
          onClick={() => setCustomTime(nowForInput())}
          style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: "0 0 8px", cursor: "pointer", display: "block" }}
        >
          Log for a different time
        </button>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
          <input
            type="datetime-local"
            value={customTime}
            onChange={(e) => setCustomTime(e.target.value)}
            style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, flex: 1 }}
          />
          <button onClick={() => setCustomTime(null)} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>
            Use now
          </button>
        </div>
      )}
      <button
        style={{ ...primaryBtnSmall, opacity: !treatmentName.trim() ? 0.5 : 1 }}
        disabled={!treatmentName.trim()}
        onClick={() => {
          onAdd(customTime, treatmentConcernIds, treatmentNewConcernName);
          setCustomTime(null);
          setTreatmentConcernIds([]);
          setTreatmentNewConcernName("");
        }}
      >
        Add treatment
      </button>
      {grouped.length > 0 && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${paperDark}` }}>
          {grouped.map((g) => (
            <div key={g.label + g.items[0].id} style={{ padding: "6px 0" }}>
              <div style={{ color: inkSoft, fontSize: 12, marginBottom: 2 }}>{g.label}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
                {g.items.map((t, i) =>
                  editingId === t.id ? (
                    <div key={t.id} style={{ width: "100%", background: paper, border: `1px solid ${border}`, borderRadius: 10, padding: 8, marginTop: 4 }}>
                      <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                        <input value={editName} onChange={(e) => setEditName(e.target.value)} style={{ ...inputStyle, padding: "6px 8px", fontSize: 13, flex: 1.4 }} />
                        <input value={editDetail} onChange={(e) => setEditDetail(e.target.value)} style={{ ...inputStyle, padding: "6px 8px", fontSize: 13, flex: 1 }} />
                      </div>
                      <div style={{ fontSize: 12, fontWeight: 600, color: inkSoft, marginBottom: 4 }}>Medications given</div>
                      {knownMedicationNames.length > 0 && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 6 }}>
                          {knownMedicationNames.map((name) =>
                            medPickerChip(name, editMedNames.includes(name), () => toggleEditMedName(name))
                          )}
                        </div>
                      )}
                      <input
                        placeholder="New medication name"
                        value={editNewMedName}
                        onChange={(e) => setEditNewMedName(e.target.value)}
                        style={{ ...inputStyle, fontSize: 12, padding: "6px 8px", marginBottom: 6 }}
                      />
                      <ConcernPicker
                        concerns={concerns}
                        selectedConcernIds={editConcernIds}
                        toggleConcernSelection={toggleEditConcern}
                        newConcernName={editNewConcernName}
                        setNewConcernName={setEditNewConcernName}
                      />
                      <input
                        type="datetime-local"
                        value={editTime}
                        onChange={(e) => setEditTime(e.target.value)}
                        style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, width: "100%", marginTop: 8, marginBottom: 6 }}
                      />
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <button onClick={saveEdit} style={{ ...primaryBtnSmall, padding: "6px 12px", fontSize: 12 }}>Save</button>
                        <button onClick={cancelEdit} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                        <button
                          onClick={() => { onDelete(t.id); cancelEdit(); }}
                          style={{ background: "none", border: "none", color: red, fontSize: 12, cursor: "pointer", marginLeft: "auto" }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ) : (
                    <span key={t.id} style={{ display: "inline-flex", alignItems: "center", gap: 2, fontSize: 14 }}>
                      {i > 0 && <span style={{ color: inkSoft, marginRight: 2 }}>,</span>}
                      <button onClick={() => startEdit(t)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 14, color: ink, textDecoration: "underline", textDecorationColor: border }}>
                        {medLabel(t)}{t.medicationNames && t.medicationNames.length > 0 ? ` (with ${t.medicationNames.join(", ")})` : ""}
                      </button>
                    </span>
                  )
                )}
              </div>
            </div>
          ))}
        </div>
      )}
      </>
      )}
    </div>
  );
}

function NoteSection({ notes, noteText, setNoteText, noteConcernIds, toggleNoteConcern, noteNewConcernName, setNoteNewConcernName, onAdd, onDelete, onUpdate, concerns }) {
  const sorted = [...notes].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 8);
  const [customTime, setCustomTime] = useState(null); // null = log at "now" (the fast default)
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");
  const [editTime, setEditTime] = useState("");
  const [editConcernIds, setEditConcernIds] = useState([]);
  const [editNewConcernName, setEditNewConcernName] = useState("");
  const [collapsed, setCollapsed] = useState(false);

  function toggleEditConcern(id) {
    setEditConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }
  function startEdit(n) {
    setEditingId(n.id);
    setEditText(n.text);
    setEditTime(isoToLocalInput(n.timestamp));
    setEditConcernIds(n.concernIds || []);
    setEditNewConcernName("");
  }
  function cancelEdit() {
    setEditingId(null);
    setEditText("");
    setEditTime("");
    setEditConcernIds([]);
    setEditNewConcernName("");
  }
  function saveEdit() {
    if (!editText.trim()) return;
    onUpdate(editingId, editText.trim(), editTime, editConcernIds, editNewConcernName);
    cancelEdit();
  }

  return (
    <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 14, marginTop: 20, marginBottom: 16 }}>
      <button
        onClick={() => setCollapsed((c) => !c)}
        style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", padding: 0, cursor: "pointer", marginBottom: collapsed ? 0 : 4 }}
      >
        <ChevronLeft size={16} color={inkSoft} style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(-90deg) scaleY(-1)", flexShrink: 0 }} />
        <div style={{ fontSize: 16, fontWeight: 700 }}>Notes{collapsed && notes.length > 0 ? ` (${notes.length})` : ""}</div>
      </button>
      {!collapsed && (
      <>
      <p style={{ fontSize: 12, color: inkSoft, margin: "0 0 10px" }}>
        Time-grounded context that doesn't fit a tracker — how the day went, what changed, anything worth remembering later.
      </p>
      <textarea
        placeholder="What's worth noting right now?"
        value={noteText}
        onChange={(e) => setNoteText(e.target.value)}
        rows={2}
        style={{ ...inputStyle, width: "100%", resize: "vertical", marginBottom: 8, fontFamily: "inherit" }}
      />
      <ConcernPicker
        concerns={concerns}
        selectedConcernIds={noteConcernIds}
        toggleConcernSelection={toggleNoteConcern}
        newConcernName={noteNewConcernName}
        setNewConcernName={setNoteNewConcernName}
      />
      {customTime === null ? (
        <button
          onClick={() => setCustomTime(nowForInput())}
          style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: "0 0 8px", cursor: "pointer", display: "block" }}
        >
          Log for a different time
        </button>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
          <input
            type="datetime-local"
            value={customTime}
            onChange={(e) => setCustomTime(e.target.value)}
            style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, flex: 1 }}
          />
          <button onClick={() => setCustomTime(null)} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>
            Use now
          </button>
        </div>
      )}
      <button
        style={{ ...primaryBtnSmall, opacity: !noteText.trim() ? 0.5 : 1 }}
        disabled={!noteText.trim()}
        onClick={() => { onAdd(customTime, noteConcernIds, noteNewConcernName); setCustomTime(null); }}
      >
        Add note
      </button>
      {sorted.length > 0 && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${paperDark}` }}>
          {sorted.map((n) =>
            editingId === n.id ? (
              <div key={n.id} style={{ background: paper, border: `1px solid ${border}`, borderRadius: 10, padding: 8, marginBottom: 8 }}>
                <textarea
                  value={editText}
                  onChange={(e) => setEditText(e.target.value)}
                  rows={2}
                  style={{ ...inputStyle, width: "100%", resize: "vertical", marginBottom: 6, fontFamily: "inherit", fontSize: 13 }}
                />
                <ConcernPicker
                  concerns={concerns}
                  selectedConcernIds={editConcernIds}
                  toggleConcernSelection={toggleEditConcern}
                  newConcernName={editNewConcernName}
                  setNewConcernName={setEditNewConcernName}
                />
                <input
                  type="datetime-local"
                  value={editTime}
                  onChange={(e) => setEditTime(e.target.value)}
                  style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, width: "100%", marginTop: 8, marginBottom: 6 }}
                />
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <button onClick={saveEdit} style={{ ...primaryBtnSmall, padding: "6px 12px", fontSize: 12 }}>Save</button>
                  <button onClick={cancelEdit} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                  <button
                    onClick={() => { onDelete(n.id); cancelEdit(); }}
                    style={{ background: "none", border: "none", color: red, fontSize: 12, cursor: "pointer", marginLeft: "auto" }}
                  >
                    Delete
                  </button>
                </div>
              </div>
            ) : (
              <button
                key={n.id}
                onClick={() => startEdit(n)}
                style={{ display: "block", width: "100%", textAlign: "left", background: "none", border: "none", padding: "8px 0", borderBottom: `1px solid ${paperDark}`, cursor: "pointer" }}
              >
                <div style={{ fontSize: 13, color: ink }}>{n.text}</div>
                <div style={{ fontSize: 11, color: inkSoft, marginTop: 2 }}>{fmtTime(n.timestamp)}</div>
              </button>
            )
          )}
        </div>
      )}
      </>
      )}
    </div>
  );
}
