const LocalStore = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("Key not found: " + key);
    return { key, value: v };
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      console.error("care-log: localStorage.setItem failed", e);
      return null;
    }
  },
};


const STORAGE_KEY = "care-log-vault-v1";
const PBKDF2_ITERATIONS = 300000;
const MAX_TRACKERS = 20; // Personal build — the real free-tier cap (3) only matters once there's an actual entitlement system with other users to enforce it against.

// Canonical storage is always Celsius; display converts at the edges.

function cToF(c) { return (c * 9) / 5 + 32; }
function fToC(f) { return ((f - 32) * 5) / 9; }
function displayTemp(celsius, system) {
  return system === "imperial" ? cToF(celsius) : celsius;
}
function toCelsius(value, system) {

}
function tempUnitLabel(system) { return system === "imperial" ? "°F" : "°C"; }

const ink = "#232320";

const paper = "#F7F4EE";

// ---------- Crypto helpers ----------
function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToBuf(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function deriveKey(passcode, saltB64, iterations) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(passcode), { name: "PBKDF2" }, false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBuf(saltB64), iterations, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}
async function encryptJSON(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv: bufToB64(iv), ciphertext: bufToB64(ciphertext) };
}
async function decryptJSON(key, ivB64, ciphertextB64) {
  const iv = new Uint8Array(b64ToBuf(ivB64));
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, b64ToBuf(ciphertextB64));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}
function fmtTime(iso) {
  return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtTimeShort(iso) {
  return new Date(iso).toLocaleString(undefined, { hour: "numeric", minute: "2-digit" });
}
function nowForInput() {
  return isoToLocalInput(new Date().toISOString());
}
function isoToLocalInput(iso) {
  const d = new Date(iso);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 16);
}
// Groups meds that display at the same minute (e.g. two given together) into one
// row instead of repeating the timestamp — "3:15 PM — Ibuprofen 200mg, Tylenol 500mg"
// rather than two separate lines. Grouping by the *displayed* time (not raw timestamp)
// means it works even if the two were logged a few seconds apart in separate taps.
function groupMedsByDisplayTime(sortedMeds) {
  const groups = [];
  for (const m of sortedMeds) {
    const label = fmtTime(m.timestamp);
    const last = groups[groups.length - 1];
    if (last && last.label === label) {
      last.items.push(m);
    } else {
      groups.push({ label, items: [m] });
    }
  }
  return groups;
}
function medLabel(m) {
  return m.name + (m.dose ? ` ${m.dose}` : "");
}
// Deterministic color per medication name — same drug always gets the same color,
// across sessions and re-renders, without needing to track any assignment order.
const MED_COLOR_PALETTE = ["#33506E", "#7D5BA6", "#B5654A", "#3F7A5E", "#C2703D", "#5C7A99", "#8A6D3B", "#6B4C6E", "#4A7A8C", "#9C5B7D"];
function medColorForName(name) {
  const key = (name || "").trim().toLowerCase();
  // FNV-1a — the previous simple polynomial hash (hash*31+char) distributes poorly
  // when reduced with a small modulus like the palette length, since 31 ≡ -1 (mod 8)
  // makes the low bits cycle instead of spreading out — that's what caused the
  // reported collisions (three different drugs landing on the same color).
  let hash = 2166136261;
  for (let i = 0; i < key.length; i++) {
    hash ^= key.charCodeAt(i);
    hash = Math.imul(hash, 16777619) >>> 0;
  }
  return MED_COLOR_PALETTE[hash % MED_COLOR_PALETTE.length];
}
function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

// ---------- Lightweight sparkline (no chart library — fast load) ----------
function Sparkline({ points, kind, unitSystem, scaleMax, meds, domain, onViewChange }) {
  const svgRef = useRef(null);
  const gestureRef = useRef(null);
  const [showMedList, setShowMedList] = useState(false);
  const [showMedMarkers, setShowMedMarkers] = useState(true);
  const width = 260, height = 100, pad = 8;
  const chartLeft = 34; // reserve space for axis labels
  const plotWidth = width - chartLeft;
  if (!points || points.length === 0) {
    return <div style={{ fontSize: 12, color: inkSoft, padding: "18px 0" }}>No readings yet</div>;
  }
  const display = kind === "temperature" ? points.map((p) => ({ t: p.t, v: displayTemp(p.v, unitSystem) })) : points;
  const minY = kind === "temperature" ? (unitSystem === "imperial" ? 95 : 35) : 0;
  const maxY = kind === "temperature" ? (unitSystem === "imperial" ? 106 : 41) : (scaleMax || 5);
  const feverLine = kind === "temperature" ? displayTemp(FEVER_C, unitSystem) : null;
  const unit = kind === "temperature" ? tempUnitLabel(unitSystem) : "";
  const xs = display.map((p) => p.t);
  // Prefer the shared domain (same timeline across every tracker + med chart) — fall
  // back to this chart's own data only if no shared domain was supplied.
  const minX = domain ? domain.minX : Math.min(...xs);
  const maxX = domain ? domain.maxX : Math.max(...xs);
  const scaleX = (t) => ((t - minX) / (maxX - minX || 1)) * (plotWidth - pad * 2) + pad + chartLeft;
  const scaleY = (v) => height - pad - ((v - minY) / (maxY - minY)) * (height - pad * 2);
  const d = display.map((p, i) => `${i === 0 ? "M" : "L"} ${scaleX(p.t).toFixed(1)} ${scaleY(p.v).toFixed(1)}`).join(" ");
  const last = display[display.length - 1];
  const axisLabelStyle = { fontSize: 9, fill: inkSoft, fontFamily: "-apple-system, sans-serif" };
  const span = maxX - minX;
  function fmtAxisTime(t) {
    const dt = new Date(t);
    return span <= 48 * 3600 * 1000
      ? dt.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
      : dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  // ---------- Pinch-to-zoom / drag-to-pan ----------
  // Uses refs (not state) to track an in-progress gesture so intermediate touchmove
  // events don't each trigger a full re-render — only the resulting domain change does,
  // via onViewChange, which is owned by the parent so every chart stays in sync.
  function touchDistance(t0, t1) {
    const dx = t0.clientX - t1.clientX;
    const dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function handleTouchStart(e) {
    if (!onViewChange || !svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    if (e.touches.length === 2) {
      const [t0, t1] = e.touches;
      gestureRef.current = {
        mode: "pinch", rect, startMinX: minX, startMaxX: maxX,
        startDist: touchDistance(t0, t1),
        centerClientX: (t0.clientX + t1.clientX) / 2,
      };
    } else if (e.touches.length === 1) {
      gestureRef.current = { mode: "pan", rect, startMinX: minX, startMaxX: maxX, startClientX: e.touches[0].clientX };
    }
  }
  function handleTouchMove(e) {
    const g = gestureRef.current;
    if (!g || !onViewChange) return;
    try { e.preventDefault(); } catch (_) {}
    const cssScale = g.rect.width / width || 1;
    const span = g.startMaxX - g.startMinX;
    if (g.mode === "pan" && e.touches.length === 1) {
      const dxLogical = (e.touches[0].clientX - g.startClientX) / cssScale;
      const pxToTime = span / plotWidth;
      const shift = -dxLogical * pxToTime;
      onViewChange({ minX: g.startMinX + shift, maxX: g.startMaxX + shift });
    } else if (g.mode === "pinch" && e.touches.length === 2) {
      const [t0, t1] = e.touches;
      const dist = touchDistance(t0, t1);
      const ratio = Math.max(dist / (g.startDist || 1), 0.05);
      const newSpan = span / ratio;
      const anchorLogicalX = (g.centerClientX - g.rect.left) / cssScale;
      const anchorFraction = Math.min(Math.max((anchorLogicalX - chartLeft) / plotWidth, 0), 1);
      const anchorTime = g.startMinX + anchorFraction * span;
      const newMin = anchorTime - anchorFraction * newSpan;
      onViewChange({ minX: newMin, maxX: newMin + newSpan });
    }
  }
  function handleTouchEnd() {
    gestureRef.current = null;
  }

  // Medications logged within this chart's visible time range, shown as a bullet
  // with a diagonal label rising from it. Grouped by displayed minute first (same
  // grouping used in the medication list) so two meds given together produce one
  // combined label instead of two overlapping ones. Markers that still land close
  // together in pixel space (different times, similar chart position) get staggered
  // vertically so their diagonal lines don't run through each other.
  const medSpan = Math.max(maxX - minX, 1);
  const medPad = medSpan * 0.05;
  const medsInRange = (meds || [])
    .map((m) => ({ ...m, t: new Date(m.timestamp).getTime() }))
    .filter((m) => m.t >= minX - medPad && m.t <= maxX + medPad)
    .sort((a, b) => a.t - b.t);
  // Chart markers: one diamond per individual dose, never merged — two drugs taken
  // together are still two separate doses and get two separate, differently-colored
  // markers, even though they're staggered close together for visibility. The
  // grouped/combined version (chartMedGroups below) is only used for the readable
  // tap-to-expand list, where combining same-time doses onto one line is purely a
  // display convenience, not a change to the underlying data.
  const chartMedGroups = groupMedsByDisplayTime(medsInRange).map((g) => ({
    label: g.items.map(medLabel).join(", "),
    t: g.items[0].t,
    id: g.items[0].id,
  }));
  // Medication markers get their own row below the plot, not inside the
  // temperature/value range — this keeps them visually distinct from real data
  // points regardless of how low a reading happens to be.
  const MED_ROW_GAP = 10;
  const medBaseY = height + MED_ROW_GAP;
  const MIN_MARKER_GAP_PX = 14;
  let lastX = -Infinity;
  let stagger = 0;
  const staggeredMeds = medsInRange.map((m) => {
    const x = scaleX(m.t);
    stagger = x - lastX < MIN_MARKER_GAP_PX ? stagger + 1 : 0;
    lastX = x;
    return { ...m, x, extraLift: stagger * 7, color: medColorForName(m.name) };
  });
  // Bounded label set so the chart stays clean at every zoom level, not just some of
  // them. When there's room, label every point. When zoomed out to many points, don't
  // go silent — always surface the most recent reading and the peak, tagged so it's
  // clear why those two specifically are called out.
  const MAX_LABEL_ALL = 8;
  let valueLabels = [];
  function withCollisionAvoidance(points) {
    let lastLabelX = -Infinity;
    let labelBelow = false;
    return points.map((p) => {
      const x = scaleX(p.t);
      labelBelow = x - lastLabelX < 26 ? !labelBelow : false;
      lastLabelX = x;
      return { x, y: scaleY(p.v), value: p.v, below: labelBelow, tag: p.tag };
    });
  }
  if (kind === "temperature" && display.length > 0) {
    if (display.length <= MAX_LABEL_ALL) {
      valueLabels = withCollisionAvoidance(display);
    } else {
      const latest = display[display.length - 1];
      const peak = display.reduce((a, b) => (b.v > a.v ? b : a), display[0]);
      const chosen = [{ ...latest, tag: "Now" }];
      if (peak.t !== latest.t) chosen.push({ ...peak, tag: "Peak" });
      chosen.sort((a, b) => a.t - b.t);
      valueLabels = withCollisionAvoidance(chosen);
    }
  }

  const AXIS_ROW_HEIGHT = 14;
  const medRowHeight = showMedMarkers && staggeredMeds.length ? MED_ROW_GAP + 8 + Math.max(...staggeredMeds.map((m) => m.extraLift), 0) : 0;
  const chartHeight = height + medRowHeight + AXIS_ROW_HEIGHT;
  const sortedMedList = groupMedsByDisplayTime(medsInRange); // grouped-by-time, for the readable list only
  const xAxisY = chartHeight - 2;

  return (
    <div>
      <svg
        ref={svgRef}
        width={width}
        height={chartHeight}
        style={{ overflow: "visible", touchAction: "none" }}
        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}
        onTouchEnd={handleTouchEnd}
        onTouchCancel={handleTouchEnd}
        role="img"
        aria-label={`Trend chart from ${fmtAxisTime(minX)} to ${fmtAxisTime(maxX)}, scale ${minY} to ${maxY}${unit}, latest value ${last.v.toFixed(1)}${unit}${staggeredMeds.length ? `. Medications in range: ${staggeredMeds.map(medLabel).join("; ")}` : ""}`}>
        {kind === "temperature" && (
          <rect x={chartLeft} y={scaleY(feverLine)} width={plotWidth} height={Math.max(scaleY(maxY) - scaleY(feverLine), 0)} fill={redSoft} opacity={0.5} />
        )}
        <text x={0} y={scaleY(maxY) + 3} style={axisLabelStyle}>{maxY.toFixed(0)}{unit}</text>
        <text x={0} y={scaleY(minY) - 1} style={axisLabelStyle}>{minY.toFixed(0)}{unit}</text>
        {kind === "temperature" && (
          <text x={0} y={scaleY(feverLine) + 3} style={{ ...axisLabelStyle, fill: red, fontWeight: 700 }}>{feverLine.toFixed(1)}</text>
        )}
        <line x1={chartLeft} y1={pad} x2={chartLeft} y2={height - pad} stroke={border} strokeWidth={1} />
        <text x={chartLeft} y={xAxisY} textAnchor="start" style={axisLabelStyle}>{fmtAxisTime(minX)}</text>
        <text x={width} y={xAxisY} textAnchor="end" style={axisLabelStyle}>{fmtAxisTime(maxX)}</text>
        <path d={d} fill="none" stroke={ink} strokeWidth={1.5} />
        {display.map((p, i) => (
          <circle key={i} cx={scaleX(p.t)} cy={scaleY(p.v)} r={2.5} fill={kind === "temperature" && p.v >= feverLine ? red : teal} />
        ))}
        {/* Temperature values written next to each point when there's room. Once a
            chart has more points than fit cleanly, it doesn't go silent — it always
            shows the most recent reading and the peak, tagged, so there's never a
            zoom level where the chart has numbers everywhere or nowhere. */}
        {valueLabels.map((l, i) => (
          <g key={i}>
            <text
              x={l.x} y={l.below ? l.y + 14 : l.y - 6} textAnchor="middle"
              fontSize={10} fontWeight={700} fill="none" stroke={card} strokeWidth={3} strokeLinejoin="round"
              fontFamily="-apple-system, sans-serif"
            >
              {l.tag ? `${l.tag} ` : ""}{l.value.toFixed(1)}{l.tag ? unit : ""}
            </text>
            <text
              x={l.x} y={l.below ? l.y + 14 : l.y - 6} textAnchor="middle"
              fontSize={10} fontWeight={700} fill={l.tag === "Peak" ? red : ink}
              fontFamily="-apple-system, sans-serif"
            >
              {l.tag ? `${l.tag} ` : ""}{l.value.toFixed(1)}{l.tag ? unit : ""}
            </text>
          </g>
        ))}
        {/* One diamond per individual dose, colored by drug — two medications taken
            together are still two markers, just staggered close together, never
            merged into one. Below the plot, in their own row, so they can never be
            confused with the actual data dots. The "Medications in view" list below
            is the readable source for names/doses/times; these just mark when/what. */}
        {showMedMarkers && staggeredMeds.map((m) => (
          <rect
            key={m.id}
            x={-4.5} y={-4.5} width={9} height={9} rx={1.5}
            fill={m.color} stroke={card} strokeWidth={1.5}
            transform={`translate(${m.x}, ${medBaseY + m.extraLift}) rotate(45)`}
          />
        ))}
      </svg>

      {medsInRange.length > 0 && (
        <div style={{ marginTop: 4, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
          <button
            onClick={() => setShowMedList((s) => !s)}
            style={{ background: "none", border: "none", color: blue, fontSize: 11, fontWeight: 600, padding: 0, cursor: "pointer" }}
          >
            {showMedList ? "Hide medications" : `Medications in view (${medsInRange.length})`}
          </button>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: inkSoft, cursor: "pointer" }}>
            <input
              type="checkbox"
              checked={showMedMarkers}
              onChange={(e) => setShowMedMarkers(e.target.checked)}
              style={{ accentColor: blue, width: 14, height: 14 }}
            />
            Show on chart
          </label>
        </div>
      )}
      {medsInRange.length > 0 && (
        <div style={{ marginTop: 4 }}>
          {showMedList && (
            <div style={{ marginTop: 6, background: paper, border: `1px solid ${border}`, borderRadius: 10, padding: "6px 8px" }}>
              {sortedMedList.map((g) => (
                <div key={g.label + g.items[0].id} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "5px 0", borderBottom: `1px solid ${paperDark}` }}>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                    {g.items.map((m, i) => (
                      <span key={m.id} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12 }}>
                        {i > 0 && <span style={{ color: inkSoft }}>,</span>}
                        <span style={{ width: 8, height: 8, borderRadius: 2, background: medColorForName(m.name), display: "inline-block", flexShrink: 0 }} />
                        <span style={{ color: ink, fontWeight: 600 }}>{medLabel(m)}</span>
                      </span>
                    ))}
                  </div>
                  <span style={{ color: inkSoft, fontSize: 12, flexShrink: 0 }}>{g.label}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function CareLog() {
  const [phase, setPhase] = useState("loading"); // loading | setup | locked | ready
  const [errorMsg, setErrorMsg] = useState("");
  const [passcodeInput, setPasscodeInput] = useState("");
  const [passcodeConfirm, setPasscodeConfirm] = useState("");

  const [trackers, setTrackers] = useState([]);
  const [entries, setEntries] = useState([]);
  const [meds, setMeds] = useState([]);
  const [concerns, setConcerns] = useState([]); // [{id, name}] — health concerns like "Cold/Flu", "Allergies"
  const [profile, setProfile] = useState({ ageYears: "", ageMonths: "", ethnicity: "", unitSystem: "imperial" });
  const [profileDraft, setProfileDraft] = useState({ ageYears: "", ageMonths: "", ethnicity: "" });

  const [showSettings, setShowSettings] = useState(false);
  const [showBackup, setShowBackup] = useState(false);
  const [restorePasscode, setRestorePasscode] = useState("");
  const [restoreFile, setRestoreFile] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const [restoreSuccess, setRestoreSuccess] = useState(false);
  const [setupRestoreMode, setSetupRestoreMode] = useState(false);

  const [view, setView] = useState("dashboard"); // dashboard | templatePicker
  const [templateQuery, setTemplateQuery] = useState("");
  const [openTemplateId, setOpenTemplateId] = useState(null);
  const [selectedTrackerNames, setSelectedTrackerNames] = useState([]);
  const [selectedConcernIds, setSelectedConcernIds] = useState([]);
  const [newConcernName, setNewConcernName] = useState("");
  const [dashboardViewMode, setDashboardViewMode] = useState("all"); // "all" | "byConcern"

  const [draftValues, setDraftValues] = useState({});
  const [medName, setMedName] = useState("");
  const [medDose, setMedDose] = useState("");
  const [showReport, setShowReport] = useState(false);
  const [reportCopied, setReportCopied] = useState(false);

  const [saveError, setSaveError] = useState(false);

  const cryptoKeyRef = useRef(null);
  const saltRef = useRef(null);
  const skippedInitialPersist = useRef(false);
  const loadedRef = useRef(false);

  // ---------- Initial load ----------
  useEffect(() => {
    (async () => {
      try {
        const res = await LocalStore.get(STORAGE_KEY, false);
        if (res && res.value) {
          const vault = JSON.parse(res.value);
          saltRef.current = vault.saltB64;
          setPhase("locked-waiting"); // vault exists, needs passcode; render locked screen below
          setPhase("locked");
        } else {
          setPhase("setup");
        }
      } catch (e) {
        setPhase("setup");
      }
    })();
  }, []);

  // ---------- Persist (encrypt + save) ----------
  const persist = useCallback(async (nextTrackers, nextEntries, nextMeds, nextProfile, nextConcerns) => {
    if (!cryptoKeyRef.current) return;
    const payload = { trackers: nextTrackers, entries: nextEntries, meds: nextMeds, profile: nextProfile, concerns: nextConcerns };
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const { iv, ciphertext } = await encryptJSON(cryptoKeyRef.current, payload);
        const vault = { saltB64: saltRef.current, iterations: PBKDF2_ITERATIONS, iv, ciphertext };
        const result = await LocalStore.set(STORAGE_KEY, JSON.stringify(vault), false);
        if (result) {
          setSaveError(false);
          return;
        }
      } catch (e) {
        console.error("care-log: persist failed", { attempt: attempt + 1, error: e });
      }
      if (attempt < 2) await sleep(400 * (attempt + 1));
    }
    setSaveError(true);
  }, []);

  useEffect(() => {
    if (phase !== "ready") return;
    if (!skippedInitialPersist.current) {
      skippedInitialPersist.current = true;
      return;
    }
    persist(trackers, entries, meds, profile, concerns);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [trackers, entries, meds, profile, concerns]);

  // ---------- Setup (first run — create passcode) ----------
  async function handleCreatePasscode() {
    setErrorMsg("");
    if (passcodeInput.length < 4) {
      setErrorMsg("Use at least 4 characters.");
      return;
    }
    if (passcodeInput !== passcodeConfirm) {
      setErrorMsg("Passcodes don't match.");
      return;
    }
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));
    const saltB64 = bufToB64(saltBytes.buffer);
    saltRef.current = saltB64;
    const key = await deriveKey(passcodeInput, saltB64, PBKDF2_ITERATIONS);
    cryptoKeyRef.current = key;
    setPasscodeInput("");
    setPasscodeConfirm("");
    setPhase("setup-profile"); // don't persist yet — collect the (mostly optional) profile first
  }

  async function handleSaveProfile() {
    setErrorMsg("");
    const ageYears = profileDraft.ageYears === "" ? null : parseInt(profileDraft.ageYears, 10);
    const ageMonths = profileDraft.ageMonths === "" ? null : parseInt(profileDraft.ageMonths, 10);
    if ((ageYears === null || isNaN(ageYears)) && (ageMonths === null || isNaN(ageMonths))) {
      setErrorMsg("Age is required — years, or months for an infant.");
      return;
    }
    const nextProfile = {
      ageYears: ageYears || 0,
      ageMonths: ageMonths || 0,
      ethnicity: profileDraft.ethnicity.trim(),
      unitSystem: "imperial",
    };
    if (!cryptoKeyRef.current || !saltRef.current) {
      setErrorMsg("Something went wrong setting up encryption — please go back and re-create your passcode.");
      return;
    }
    try {
      const { iv, ciphertext } = await encryptJSON(cryptoKeyRef.current, { trackers: [], entries: [], meds: [], profile: nextProfile, concerns: [] });
      const vault = { saltB64: saltRef.current, iterations: PBKDF2_ITERATIONS, iv, ciphertext };
      const result = await LocalStore.set(STORAGE_KEY, JSON.stringify(vault), false);
      if (!result) throw new Error("storage.set returned no result");
      setProfile(nextProfile);
      skippedInitialPersist.current = true;
      setPhase("ready");
    } catch (e) {
      console.error("care-log: failed to save profile", e);
      setErrorMsg("Couldn't save — check your connection and try Continue again.");
    }
  }

  // ---------- Lock screen (unlock) ----------
  async function handleUnlock() {
    setErrorMsg("");
    try {
      const res = await LocalStore.get(STORAGE_KEY, false);
      const vault = JSON.parse(res.value);
      const key = await deriveKey(passcodeInput, vault.saltB64, vault.iterations);
      const data = await decryptJSON(key, vault.iv, vault.ciphertext);
      cryptoKeyRef.current = key;
      saltRef.current = vault.saltB64;
      setTrackers(data.trackers || []);
      setEntries(data.entries || []);
      setMeds(data.meds || []);
      setConcerns(data.concerns || []);
      setProfile(data.profile || { ageYears: "", ageMonths: "", ethnicity: "", unitSystem: "imperial" });
      skippedInitialPersist.current = true;
      setPasscodeInput("");
      setPhase("ready");
    } catch (e) {
      setErrorMsg("Incorrect passcode. Try again.");
    }
  }

  // ---------- Backup export / restore ----------
  async function handleExportBackup() {
    if (!cryptoKeyRef.current) return;
    const payload = { trackers, entries, meds, profile, concerns };
    const { iv, ciphertext } = await encryptJSON(cryptoKeyRef.current, payload);
    const backup = { formatVersion: 1, saltB64: saltRef.current, iterations: PBKDF2_ITERATIONS, iv, ciphertext, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `care-log-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function handleRestoreFromFile(file, passcode, isFirstRun) {
    setRestoreError("");
    setRestoreSuccess(false);
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      const key = await deriveKey(passcode, backup.saltB64, backup.iterations);
      // A successful decrypt IS the integrity check — AES-GCM's auth tag makes a
      // tampered or corrupted file fail here rather than silently restoring bad data.
      const data = await decryptJSON(key, backup.iv, backup.ciphertext);
      cryptoKeyRef.current = key;
      saltRef.current = backup.saltB64;
      setTrackers(data.trackers || []);
      setEntries(data.entries || []);
      setMeds(data.meds || []);
      setConcerns(data.concerns || []);
      setProfile(data.profile || { ageYears: "", ageMonths: "", ethnicity: "", unitSystem: "imperial" });
      skippedInitialPersist.current = true;
      setRestoreSuccess(true);
      if (isFirstRun) {
        setPhase("ready");
      } else {
        await persist(data.trackers || [], data.entries || [], data.meds || [], data.profile || profile, data.concerns || []);
        setShowBackup(false);
      }
    } catch (e) {
      setRestoreError("Couldn't restore — check the file and passcode, or the file may be from a different backup.");
    }
  }

  // ---------- Derived data ----------
  const activeTrackers = useMemo(() => trackers.filter((t) => !t.archived), [trackers]);
  const remainingSlots = MAX_TRACKERS - activeTrackers.length;

  // Absolute bounds — the full span of everything logged. Zoom/pan and range
  // presets are always clamped within this, so you can't pan into empty space.
  const fullDomain = useMemo(() => {
    const times = [];
    activeTrackers.forEach((t) => {
      entries.forEach((e) => {
        const v = e.values[t.id];
        if (v != null && typeof v !== "boolean") times.push(new Date(e.timestamp).getTime());
      });
    });
    meds.forEach((m) => times.push(new Date(m.timestamp).getTime()));
    if (times.length === 0) return null;
    return { minX: Math.min(...times), maxX: Math.max(...times) };
  }, [activeTrackers, entries, meds]);

  const [rangePreset, setRangePreset] = useState("all"); // "24h" | "3d" | "7d" | "all"
  const [customViewDomain, setCustomViewDomain] = useState(null); // set by pinch/drag on any chart

  const presetDomain = useMemo(() => {
    if (rangePreset === "all" || !fullDomain) return null;
    const hours = { "24h": 24, "3d": 72, "7d": 168 }[rangePreset];
    const end = Math.max(Date.now(), fullDomain.maxX);
    return { minX: end - hours * 3600 * 1000, maxX: end };
  }, [rangePreset, fullDomain]);

  // One shared time domain for every chart, so trackers and medications are always
  // plotted on the same timeline and can be visually compared side by side, rather
  // than each card silently picking its own window.
  const chartDomain = customViewDomain || presetDomain || fullDomain;
  const isZoomed = customViewDomain !== null || rangePreset !== "all";

  function selectRangePreset(preset) {
    setRangePreset(preset);
    setCustomViewDomain(null);
  }

  function resetView() {
    setRangePreset("all");
    setCustomViewDomain(null);
  }

  // Called by any chart's pinch/drag gesture. Clamps to fullDomain (with a little
  // outward padding so you can pan slightly past the edges) and enforces a minimum
  // zoomed-in span so the view can never collapse to nothing.
  function handleViewChange(nextDomain) {
    if (!fullDomain) return;
    const MIN_SPAN = 30 * 60 * 1000; // 30 minutes
    let { minX, maxX } = nextDomain;
    if (maxX - minX < MIN_SPAN) {
      const mid = (minX + maxX) / 2;
      minX = mid - MIN_SPAN / 2;
      maxX = mid + MIN_SPAN / 2;
    }
    const pad = Math.max((fullDomain.maxX - fullDomain.minX) * 0.1, MIN_SPAN);
    const lower = fullDomain.minX - pad;
    const upper = fullDomain.maxX + pad;
    if (minX < lower) { maxX += lower - minX; minX = lower; }
    if (maxX > upper) { minX -= maxX - upper; maxX = upper; }
    setCustomViewDomain({ minX: Math.max(minX, lower), maxX: Math.min(maxX, upper) });
  }

  const knownMedNames = useMemo(() => [...new Set(meds.map((m) => m.name.trim().toLowerCase()))], [meds]);
  const medCatalogCount = knownMedNames.length;

  const filteredTemplates = useMemo(() => {
    const q = templateQuery.trim().toLowerCase();
    if (!q) return TEMPLATES;
    return TEMPLATES.filter(
      (t) => t.label.toLowerCase().includes(q) || t.searchTerms.some((s) => s.includes(q))
    );
  }, [templateQuery]);

  function trackerSeries(trackerId) {
    return entries
      .filter((e) => e.values[trackerId] != null && typeof e.values[trackerId] !== "boolean")
      .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
      .map((e) => ({ t: new Date(e.timestamp).getTime(), v: e.values[trackerId] }));
  }

  function latestEntryFor(trackerId) {
    return [...entries]
      .filter((e) => e.values[trackerId] != null)
      .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
  }

  // Full history for a tracker (any value type, including booleans) — used by the
  // per-tracker History list, most recent first.
  function entriesForTracker(trackerId) {
    return entries
      .filter((e) => e.values[trackerId] != null)
      .map((e) => ({ id: e.id, timestamp: e.timestamp, value: e.values[trackerId] }))
      .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  }

  function updateEntryValue(entryId, trackerId, newValue, newTimeInput) {
    setEntries((prev) =>
      prev.map((e) => {
        if (e.id !== entryId) return e;
        const timestamp = newTimeInput ? new Date(newTimeInput).toISOString() : e.timestamp;
        return { ...e, timestamp, values: { ...e.values, [trackerId]: newValue } };
      })
    );
  }

  function deleteEntryValue(entryId, trackerId) {
    setEntries((prev) =>
      prev
        .map((e) => {
          if (e.id !== entryId) return e;
          const rest = { ...e.values };
          delete rest[trackerId];
          return { ...e, values: rest };
        })
        .filter((e) => Object.keys(e.values).length > 0)
    );
  }

  // ---------- Actions ----------
  function openTemplate(id) {
    const t = TEMPLATES.find((tt) => tt.id === id);
    if (!t) return;
    const preselect = t.trackers.slice(0, Math.max(remainingSlots, 0)).map((tr) => tr.name);
    setSelectedTrackerNames(preselect);
    // If a concern already exists with this template's name, suggest attaching to it
    // instead of silently creating a duplicate; otherwise suggest creating a new one.
    const existingMatch = concerns.find((c) => c.name.toLowerCase() === t.label.toLowerCase());
    setSelectedConcernIds(existingMatch ? [existingMatch.id] : []);
    setNewConcernName(existingMatch ? "" : t.label);
    setOpenTemplateId(id);
  }

  function toggleTrackerSelection(name) {
    setSelectedTrackerNames((prev) => (prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]));
  }

  function toggleConcernSelection(id) {
    setSelectedConcernIds((prev) => (prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]));
  }

  function addSelectedTrackers() {
    const template = TEMPLATES.find((t) => t.id === openTemplateId);
    if (!template) return;
    const toAdd = template.trackers.filter((tr) => selectedTrackerNames.includes(tr.name));
    if (toAdd.length === 0 || toAdd.length > remainingSlots) return;

    // Resolve concerns: reuse any selected existing ones, plus a new one if the user
    // typed a name that doesn't match an existing concern. A tracker can end up tagged
    // with multiple concerns — that's the point, since a symptom like a cough can
    // genuinely belong to more than one thing you're tracking at once.
    let finalConcernIds = [...selectedConcernIds];
    const trimmedNew = newConcernName.trim();
    if (trimmedNew) {
      const existing = concerns.find((c) => c.name.toLowerCase() === trimmedNew.toLowerCase());
      if (existing) {
        if (!finalConcernIds.includes(existing.id)) finalConcernIds.push(existing.id);
      } else {
        const newConcern = { id: uid(), name: trimmedNew };
        setConcerns((prev) => [...prev, newConcern]);
        finalConcernIds.push(newConcern.id);
      }
    }

    const newTrackers = toAdd.map((tr) => ({
      id: uid(),
      name: tr.name,
      type: tr.type,
      unit: tr.unit,
      scaleMax: tr.scaleMax || 5,
      sourceTemplateId: template.id,
      concernIds: finalConcernIds,
      archived: false,
    }));
    setTrackers((prev) => [...prev, ...newTrackers]);
    setOpenTemplateId(null);
    setSelectedTrackerNames([]);
    setSelectedConcernIds([]);
    setNewConcernName("");
    setTemplateQuery("");
    setView("dashboard");
  }

  function archiveTracker(id) {
    setTrackers((prev) => prev.map((t) => (t.id === id ? { ...t, archived: true } : t)));
  }

  function logValue(trackerId, value, isTemperature, atTime) {
    const timestamp = atTime ? new Date(atTime).toISOString() : new Date().toISOString();
    const stored = isTemperature ? toCelsius(value, profile.unitSystem) : value;
    setEntries((prev) => [...prev, { id: uid(), timestamp, values: { [trackerId]: stored } }]);
    setDraftValues((d) => ({ ...d, [trackerId]: undefined }));
  }

  function addMedication(atTime) {
    const name = medName.trim();
    if (!name) return;
    const isNewDistinct = !knownMedNames.includes(name.toLowerCase());
    if (isNewDistinct && medCatalogCount >= MAX_MEDICATIONS) return;
    const timestamp = atTime ? new Date(atTime).toISOString() : new Date().toISOString();
    setMeds((prev) => [...prev, { id: uid(), name, dose: medDose.trim(), timestamp }]);
    setMedName("");
    setMedDose("");
  }

  function deleteMed(id) {
    setMeds((prev) => prev.filter((m) => m.id !== id));
  }

  function updateMed(id, newName, newDose, newTimeInput) {
    setMeds((prev) =>
      prev.map((m) =>
        m.id === id
          ? { ...m, name: newName, dose: newDose, timestamp: newTimeInput ? new Date(newTimeInput).toISOString() : m.timestamp }
          : m
      )
    );
  }

  const reportText = useMemo(() => {
    const since = new Date(Date.now() - 72 * 3600 * 1000);
    const lines = [`Care Log summary — last 72 hours`, `Generated ${new Date().toLocaleString()}`, ""];
    activeTrackers.forEach((t) => {
      const recent = entries
        .filter((e) => e.values[t.id] != null && new Date(e.timestamp) >= since)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      lines.push(`${t.name}:`);
      if (recent.length === 0) lines.push("  no readings");
      else recent.forEach((e) => {
        const v = t.type === "temperature" ? displayTemp(e.values[t.id], profile.unitSystem).toFixed(1) : e.values[t.id];
        lines.push(`  ${fmtTime(e.timestamp)} — ${v}${t.type === "temperature" ? tempUnitLabel(profile.unitSystem) : ""}`);
      });
      lines.push("");
    });
    const recentMeds = meds
      .filter((m) => new Date(m.timestamp) >= since)
      .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    lines.push("Medications:");
    if (recentMeds.length === 0) lines.push("  none logged");
    else groupMedsByDisplayTime(recentMeds).forEach((g) =>
      lines.push(`  ${g.label} — ${g.items.map(medLabel).join(", ")}`)
    );
    return lines.join("\n");
  }, [activeTrackers, entries, meds]);

  async function copyReport() {
    try {
      await navigator.clipboard.writeText(reportText);
      setReportCopied(true);
      setTimeout(() => setReportCopied(false), 2000);
    } catch (e) {
      // clipboard may be blocked; text is still selectable on screen
    }
  }

  // ---------- Render ----------
  if (phase === "loading") {
    return <div style={{ background: paper, minHeight: "100vh" }} />;
  }

  if (phase === "setup") {
    return (
      <Screen title="Set up your passcode">
        <p style={{ fontSize: 14, color: inkSoft, margin: "0 0 18px" }}>
          This locks the app and encrypts everything you log. There's no account and no password reset —
          if you forget this passcode, your data can't be recovered, by us or anyone else.
        </p>
        {!setupRestoreMode ? (
          <>
            <Field label="Passcode">
              <input type="password" value={passcodeInput} onChange={(e) => setPasscodeInput(e.target.value)} style={inputStyle} autoFocus />
            </Field>
            <Field label="Confirm passcode">
              <input type="password" value={passcodeConfirm} onChange={(e) => setPasscodeConfirm(e.target.value)} style={inputStyle} />
            </Field>
            {errorMsg && <div style={errorStyle}>{errorMsg}</div>}
            <button style={primaryBtn} onClick={handleCreatePasscode}>Create passcode</button>
            <button style={linkBtn} onClick={() => setSetupRestoreMode(true)}>Restore from a backup instead</button>
          </>
        ) : (
          <>
            <Field label="Backup file">
              <input type="file" accept="application/json" onChange={(e) => setRestoreFile(e.target.files[0] || null)} style={inputStyle} />
            </Field>
            <Field label="Backup passcode">
              <input type="password" value={restorePasscode} onChange={(e) => setRestorePasscode(e.target.value)} style={inputStyle} />
            </Field>
            {restoreError && <div style={errorStyle}>{restoreError}</div>}
            <button
              style={{ ...primaryBtn, opacity: !restoreFile || !restorePasscode ? 0.5 : 1 }}
              disabled={!restoreFile || !restorePasscode}
              onClick={() => handleRestoreFromFile(restoreFile, restorePasscode, true)}
            >
              Restore
            </button>
            <button style={linkBtn} onClick={() => setSetupRestoreMode(false)}>Set up a new passcode instead</button>
          </>
        )}
      </Screen>
    );
  }

  if (phase === "setup-profile") {
    return (
      <Screen title="About the person you're tracking">
        <p style={{ fontSize: 14, color: inkSoft, margin: "0 0 18px" }}>
          Only age is required. This helps show age-appropriate ranges — it never limits which
          trackers are available to you.
        </p>
        <div style={{ display: "flex", gap: 8 }}>
          <Field label="Age (years)">
            <input type="number" min="0" value={profileDraft.ageYears} onChange={(e) => setProfileDraft((p) => ({ ...p, ageYears: e.target.value }))} style={inputStyle} autoFocus />
          </Field>
          <Field label="Or months, if an infant">
            <input type="number" min="0" value={profileDraft.ageMonths} onChange={(e) => setProfileDraft((p) => ({ ...p, ageMonths: e.target.value }))} style={inputStyle} />
          </Field>
        </div>
        <Field label="Ethnic background (optional)">
          <input value={profileDraft.ethnicity} onChange={(e) => setProfileDraft((p) => ({ ...p, ethnicity: e.target.value }))} style={inputStyle} placeholder="Prefer not to say — leave blank" />
        </Field>
        {errorMsg && <div style={errorStyle}>{errorMsg}</div>}
        <button style={primaryBtn} onClick={handleSaveProfile}>Continue</button>
      </Screen>
    );
  }

  if (phase === "locked") {
    return (
      <Screen title="Enter your passcode">
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
          <Lock size={28} color={inkSoft} />
        </div>
        <Field label="Passcode">
          <input
            type="password"
            value={passcodeInput}
            onChange={(e) => setPasscodeInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && handleUnlock()}
            style={inputStyle}
            autoFocus
          />
        </Field>
        {errorMsg && <div style={errorStyle}>{errorMsg}</div>}
        <button style={primaryBtn} onClick={handleUnlock}>Unlock</button>
      </Screen>
    );
  }

  // phase === "ready"
  return (
    <div style={{ background: paper, minHeight: "100vh", color: ink }}>
      <GlobalStyle />
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "20px 16px 80px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 18 }}>
          <h1 style={{ fontSize: 26, fontWeight: 700, margin: 0, fontFamily: "Georgia, serif" }}>Care Log</h1>
          <div style={{ display: "flex", gap: 4 }}>
            <button style={linkBtnSmall} onClick={() => setShowSettings((s) => !s)}>Units</button>
            <button style={linkBtnSmall} onClick={() => setShowBackup((s) => !s)}>Backup</button>
          </div>
        </div>

        {showSettings && (
          <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Units</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button
                style={{ ...toggleBtn, ...(profile.unitSystem === "imperial" ? toggleBtnActive : {}) }}
                onClick={() => setProfile((p) => ({ ...p, unitSystem: "imperial" }))}
              >
                °F (imperial)
              </button>
              <button
                style={{ ...toggleBtn, ...(profile.unitSystem === "metric" ? toggleBtnActive : {}) }}
                onClick={() => setProfile((p) => ({ ...p, unitSystem: "metric" }))}
              >
                °C (metric)
              </button>
            </div>
          </div>
        )}

        {showBackup && (
          <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Back up your data</div>
            <p style={{ fontSize: 12, color: inkSoft, margin: "0 0 10px" }}>
              Saves an encrypted file, protected by your app passcode, that you can store anywhere or use to restore on another device.
            </p>
            <button style={primaryBtnSmall} onClick={handleExportBackup}>Download backup</button>

            <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${paperDark}` }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Restore from a backup</div>
              <p style={{ fontSize: 12, color: red, margin: "0 0 8px" }}>This replaces everything currently in the app with the backup's contents.</p>
              <input type="file" accept="application/json" onChange={(e) => setRestoreFile(e.target.files[0] || null)} style={{ ...inputStyle, marginBottom: 8 }} />
              <input type="password" placeholder="Backup passcode" value={restorePasscode} onChange={(e) => setRestorePasscode(e.target.value)} style={{ ...inputStyle, marginBottom: 8 }} />
              {restoreError && <div style={errorStyle}>{restoreError}</div>}
              {restoreSuccess && <div style={{ ...errorStyle, background: tealSoft, color: teal, borderColor: teal }}>Restored.</div>}
              <button
                style={{ ...primaryBtnSmall, opacity: !restoreFile || !restorePasscode ? 0.5 : 1 }}
                disabled={!restoreFile || !restorePasscode}
                onClick={() => handleRestoreFromFile(restoreFile, restorePasscode, false)}
              >
                Restore this backup
              </button>
            </div>
          </div>
        )}

        {view === "templatePicker" ? (
          <TemplatePicker
            query={templateQuery}
            setQuery={setTemplateQuery}
            templates={filteredTemplates}
            remainingSlots={remainingSlots}
            openTemplateId={openTemplateId}
            openTemplate={openTemplate}
            selectedTrackerNames={selectedTrackerNames}
            toggleTrackerSelection={toggleTrackerSelection}
            addSelectedTrackers={addSelectedTrackers}
            onClose={() => { setView("dashboard"); setOpenTemplateId(null); setTemplateQuery(""); }}
            concerns={concerns}
            selectedConcernIds={selectedConcernIds}
            toggleConcernSelection={toggleConcernSelection}
            newConcernName={newConcernName}
            setNewConcernName={setNewConcernName}
          />
        ) : activeTrackers.length === 0 ? (
          // First-run / zero-active-trackers state: nothing but the one action.
          <div style={{ display: "flex", justifyContent: "center", padding: "20vh 0" }}>
            <button style={bigTrackBtn} onClick={() => setView("templatePicker")}>
              <Plus size={22} style={{ marginRight: 8 }} /> Track a symptom
            </button>
          </div>
        ) : (
          <>
            {activeTrackers.length > 0 && chartDomain && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                {[
                  { key: "24h", label: "24h" },
                  { key: "3d", label: "3 days" },
                  { key: "7d", label: "7 days" },
                  { key: "all", label: "All" },
                ].map((r) => (
                  <button
                    key={r.key}
                    onClick={() => selectRangePreset(r.key)}
                    style={{
                      ...toggleBtn, flex: "0 0 auto", padding: "6px 12px", fontSize: 12,
                      ...(rangePreset === r.key && customViewDomain === null ? toggleBtnActive : {}),
                    }}
                  >
                    {r.label}
                  </button>
                ))}
                {isZoomed && (
                  <button onClick={resetView} style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                    Reset view
                  </button>
                )}
              </div>
            )}

            {(() => {
              const renderCard = (t, keySuffix) => (
                <TrackerCard
                  key={`${t.id}-${keySuffix}`}
                  tracker={t}
                  series={trackerSeries(t.id)}
                  latest={latestEntryFor(t.id)}
                  history={entriesForTracker(t.id)}
                  unitSystem={profile.unitSystem}
                  meds={meds}
                  domain={chartDomain}
                  onViewChange={handleViewChange}
                  draftValue={draftValues[t.id]}
                  onDraftChange={(v) => setDraftValues((d) => ({ ...d, [t.id]: v }))}
                  onLog={(v, atTime) => logValue(t.id, v, t.type === "temperature", atTime)}
                  onArchive={() => archiveTracker(t.id)}
                  onUpdateEntry={(entryId, newValue, newTime) => updateEntryValue(entryId, t.id, newValue, newTime)}
                  onDeleteEntry={(entryId) => deleteEntryValue(entryId, t.id)}
                />
              );

              const concernGroups = concerns
                .map((c) => ({ ...c, trackers: activeTrackers.filter((t) => (t.concernIds || []).includes(c.id)) }))
                .filter((g) => g.trackers.length > 0);
              const ungrouped = activeTrackers.filter((t) => !(t.concernIds || []).length);

              if (concernGroups.length === 0) {
                // No concerns in use yet — the toggle would be pointless, just show the flat list.
                return activeTrackers.map((t) => renderCard(t, "flat"));
              }

              return (
                <>
                  <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                    <button
                      onClick={() => setDashboardViewMode("all")}
                      style={{ ...toggleBtn, padding: "6px 12px", fontSize: 12, ...(dashboardViewMode === "all" ? toggleBtnActive : {}) }}
                    >
                      All
                    </button>
                    <button
                      onClick={() => setDashboardViewMode("byConcern")}
                      style={{ ...toggleBtn, padding: "6px 12px", fontSize: 12, ...(dashboardViewMode === "byConcern" ? toggleBtnActive : {}) }}
                    >
                      By health concern
                    </button>
                  </div>

                  {dashboardViewMode === "all"
                    ? activeTrackers.map((t) => renderCard(t, "flat"))
                    : (
                      <>
                        {concernGroups.map((g) => (
                          <div key={g.id} style={{ marginBottom: 16 }}>
                            <div style={{ fontSize: 14, fontWeight: 700, color: inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8 }}>
                              {g.name}
                            </div>
                            {g.trackers.map((t) => renderCard(t, g.id))}
                          </div>
                        ))}
                        {ungrouped.length > 0 && (
                          <div>
                            <div style={{ fontSize: 14, fontWeight: 700, color: inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8 }}>
                              Other
                            </div>
                            {ungrouped.map((t) => renderCard(t, "other"))}
                          </div>
                        )}
                      </>
                    )}
                </>
              );
            })()}

            <button style={secondaryTrackBtn} onClick={() => setView("templatePicker")}>
              <Plus size={18} style={{ marginRight: 6 }} /> Track a symptom
            </button>

            <MedicationSection
              meds={meds}
              medName={medName}
              setMedName={setMedName}
              medDose={medDose}
              setMedDose={setMedDose}
              onAdd={addMedication}
              onDelete={deleteMed}
              onUpdate={updateMed}
              catalogCount={medCatalogCount}
              knownMedNames={knownMedNames}
            />

            <ReportSection
              show={showReport}
              setShow={setShowReport}
              text={reportText}
              onCopy={copyReport}
              copied={reportCopied}
            />
          </>
        )}

        {saveError && (
          <div style={{ ...errorStyle, marginTop: 16 }}>
            Couldn't save changes — your entries are still here in this session, but retry saving before closing the app.
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Subcomponents ----------

function Screen({ title, children }) {
  return (
    <div style={{ background: paper, minHeight: "100vh", color: ink, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <GlobalStyle />
      <div style={{ width: "100%", maxWidth: 380, padding: "0 20px" }}>
        <h1 style={{ fontSize: 22, fontWeight: 700, marginBottom: 16, fontFamily: "Georgia, serif" }}>{title}</h1>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: inkSoft, marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.4 }}>
        {label}
      </label>
      {children}
    </div>
  );
}

function TrackerCard({ tracker, series, latest, history, unitSystem, meds, domain, onViewChange, draftValue, onDraftChange, onLog, onArchive, onUpdateEntry, onDeleteEntry }) {
  const unitLabel = tracker.type === "temperature" ? tempUnitLabel(unitSystem) : null;
  const [customTime, setCustomTime] = useState(null); // null = log at "now" (the fast default)
  const [showHistory, setShowHistory] = useState(false);
  const [showAllHistory, setShowAllHistory] = useState(false);
  const [editingEntryId, setEditingEntryId] = useState(null);
  const [editValue, setEditValue] = useState(undefined);
  const [editTime, setEditTime] = useState("");
  const logAt = (value) => onLog(value, customTime);

  function startEdit(entry) {
    setEditingEntryId(entry.id);
    setEditValue(entry.value);
    setEditTime(isoToLocalInput(entry.timestamp));
  }
  function cancelEdit() {
    setEditingEntryId(null);
    setEditValue(undefined);
    setEditTime("");
  }
  function saveEdit() {
    if (editValue === undefined || editValue === "") return;
    const value = tracker.type === "boolean" ? editValue : Number(editValue);
    onUpdateEntry(editingEntryId, value, editTime);
    cancelEdit();
  }
  function formatValue(v) {
    if (typeof v === "boolean") return v ? "Present" : "Absent";
    if (tracker.type === "temperature") return `${displayTemp(v, unitSystem).toFixed(1)}${unitLabel}`;
    return `${v}`;
  }

  const historyShown = showAllHistory ? history : history.slice(0, 6);

  return (
    <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 14, marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ fontSize: 16, fontWeight: 700 }}>{tracker.name}</div>
        <button aria-label={`Archive ${tracker.name}`} onClick={onArchive} style={iconBtn}>
          <Trash2 size={16} color={inkSoft} />
        </button>
      </div>

      <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
        <Sparkline points={series} kind={tracker.type} unitSystem={unitSystem} scaleMax={tracker.scaleMax} meds={tracker.type !== "boolean" ? meds : null} domain={domain} onViewChange={onViewChange} />
        <div style={{ flex: 1, minWidth: 140 }}>
          {tracker.type === "temperature" && (
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input
                type="number"
                inputMode="decimal"
                step="0.1"
                placeholder={unitSystem === "imperial" ? "98.6" : "37.0"}
                value={draftValue ?? ""}
                onChange={(e) => onDraftChange(e.target.value === "" ? "" : parseFloat(e.target.value))}
                style={{ ...inputStyle, width: 90 }}
              />
              <span style={{ fontSize: 13, color: inkSoft }}>{unitLabel}</span>
              <button style={primaryBtnSmall} onClick={() => draftValue !== undefined && draftValue !== "" && logAt(draftValue)}>
                Log
              </button>
            </div>
          )}
          {tracker.type === "scale" && (
            <div style={{ display: "flex", gap: 6 }}>
              {Array.from({ length: (tracker.scaleMax || 5) + 1 }, (_, n) => n).map((n) => (
                <button key={n} style={scaleBtn} onClick={() => logAt(n)}>{n}</button>
              ))}
            </div>
          )}
          {tracker.type === "boolean" && (
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...scaleBtn, width: "auto", padding: "8px 14px" }} onClick={() => logAt(true)}>Present</button>
              <button style={{ ...scaleBtn, width: "auto", padding: "8px 14px" }} onClick={() => logAt(false)}>Absent</button>
            </div>
          )}

          {customTime === null ? (
            <button
              onClick={() => setCustomTime(nowForInput())}
              style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: "6px 0 0", cursor: "pointer" }}
            >
              Log for a different time
            </button>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6 }}>
              <input
                type="datetime-local"
                value={customTime}
                onChange={(e) => setCustomTime(e.target.value)}
                style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, flex: 1 }}
              />
              <button onClick={() => setCustomTime(null)} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>
                Use now
              </button>
            </div>
          )}

          {latest && (
            <div style={{ fontSize: 12, color: inkSoft, marginTop: 6 }}>
              Last: {typeof latest.values[tracker.id] === "boolean"
                ? (latest.values[tracker.id] ? "Present" : "Absent")
                : tracker.type === "temperature"
                  ? displayTemp(latest.values[tracker.id], unitSystem).toFixed(1)
                  : latest.values[tracker.id]}
              {unitLabel || ""} · {fmtTimeShort(latest.timestamp)}
            </div>
          )}
        </div>
      </div>

      {history.length > 0 && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${paperDark}` }}>
          <button
            onClick={() => setShowHistory((s) => !s)}
            style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: 0, cursor: "pointer" }}
          >
            {showHistory ? "Hide history" : `History (${history.length})`}
          </button>

          {showHistory && (
            <div style={{ marginTop: 8 }}>
              {historyShown.map((entry) => (
                <div key={entry.id} style={{ padding: "6px 0", borderBottom: `1px solid ${paperDark}` }}>
                  {editingEntryId === entry.id ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {tracker.type === "temperature" && (
                        <input
                          type="number" inputMode="decimal" step="0.1"
                          value={editValue ?? ""}
                          onChange={(e) => setEditValue(e.target.value)}
                          style={{ ...inputStyle, padding: "6px 8px", fontSize: 13, width: 90 }}
                        />
                      )}
                      {tracker.type === "scale" && (
                        <div style={{ display: "flex", gap: 4 }}>
                          {Array.from({ length: (tracker.scaleMax || 5) + 1 }, (_, n) => n).map((n) => (
                            <button
                              key={n}
                              onClick={() => setEditValue(n)}
                              style={{
                                ...scaleBtn, width: 30, height: 30, fontSize: 12,
                                background: editValue === n ? teal : paper,
                                color: editValue === n ? "white" : ink,
                                borderColor: editValue === n ? teal : border,
                              }}
                            >
                              {n}
                            </button>
                          ))}
                        </div>
                      )}
                      {tracker.type === "boolean" && (
                        <div style={{ display: "flex", gap: 6 }}>
                          <button
                            onClick={() => setEditValue(true)}
                            style={{ ...scaleBtn, width: "auto", padding: "6px 10px", fontSize: 12, background: editValue === true ? teal : paper, color: editValue === true ? "white" : ink, borderColor: editValue === true ? teal : border }}
                          >
                            Present
                          </button>
                          <button
                            onClick={() => setEditValue(false)}
                            style={{ ...scaleBtn, width: "auto", padding: "6px 10px", fontSize: 12, background: editValue === false ? teal : paper, color: editValue === false ? "white" : ink, borderColor: editValue === false ? teal : border }}
                          >
                            Absent
                          </button>
                        </div>
                      )}
                      <input
                        type="datetime-local"
                        value={editTime}
                        onChange={(e) => setEditTime(e.target.value)}
                        style={{ ...inputStyle, padding: "6px 8px", fontSize: 12 }}
                      />
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={saveEdit} style={{ ...primaryBtnSmall, padding: "6px 12px", fontSize: 12 }}>Save</button>
                        <button onClick={cancelEdit} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                        <button
                          onClick={() => { onDeleteEntry(entry.id); cancelEdit(); }}
                          style={{ background: "none", border: "none", color: red, fontSize: 12, cursor: "pointer", marginLeft: "auto" }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ) : (
                    <button
                      onClick={() => startEdit(entry)}
                      style={{ display: "flex", justifyContent: "space-between", width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 13 }}
                    >
                      <span>{formatValue(entry.value)}</span>
                      <span style={{ color: inkSoft }}>{fmtTime(entry.timestamp)}</span>
                    </button>
                  )}
                </div>
              ))}
              {!showAllHistory && history.length > 6 && (
                <button
                  onClick={() => setShowAllHistory(true)}
                  style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: "6px 0 0", cursor: "pointer" }}
                >
                  Show {history.length - 6} more
                </button>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TemplatePicker({ query, setQuery, templates, remainingSlots, openTemplateId, openTemplate, selectedTrackerNames, toggleTrackerSelection, addSelectedTrackers, onClose, concerns, selectedConcernIds, toggleConcernSelection, newConcernName, setNewConcernName }) {
  const activeTemplate = templates.find((t) => t.id === openTemplateId) || TEMPLATES.find((t) => t.id === openTemplateId);

  if (openTemplateId && activeTemplate) {
    const overLimit = selectedTrackerNames.length > remainingSlots;
    return (
      <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <button aria-label="Back" style={iconBtn} onClick={() => openTemplate(null)}>
            <ChevronLeft size={20} />
          </button>
          <div style={{ fontSize: 18, fontWeight: 700 }}>{activeTemplate.label}</div>
        </div>
        <p style={{ fontSize: 13, color: inkSoft, margin: "4px 0 12px" }}>Choose which to track — up to {remainingSlots} on the free plan.</p>
        {activeTemplate.trackers.map((tr) => {
          const checked = selectedTrackerNames.includes(tr.name);
          return (
            <label key={tr.name} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 4px", borderBottom: `1px solid ${paperDark}`, cursor: "pointer" }}>
              <input type="checkbox" checked={checked} onChange={() => toggleTrackerSelection(tr.name)} style={{ width: 20, height: 20, accentColor: teal }} />
              <span style={{ fontSize: 15 }}>{tr.name}</span>
            </label>
          );
        })}

        <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${paperDark}` }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Health concern (optional)</div>
          <p style={{ fontSize: 12, color: inkSoft, margin: "0 0 8px" }}>
            Group these under a concern so you can view them together — a symptom can belong to more than one.
          </p>
          {concerns.length > 0 && (
            <div style={{ marginBottom: 8 }}>
              {concerns.map((c) => (
                <label key={c.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 2px", cursor: "pointer" }}>
                  <input
                    type="checkbox"
                    checked={selectedConcernIds.includes(c.id)}
                    onChange={() => toggleConcernSelection(c.id)}
                    style={{ width: 18, height: 18, accentColor: teal }}
                  />
                  <span style={{ fontSize: 14 }}>{c.name}</span>
                </label>
              ))}
            </div>
          )}
          <input
            placeholder="New concern, e.g. Cold / Flu"
            value={newConcernName}
            onChange={(e) => setNewConcernName(e.target.value)}
            style={{ ...inputStyle, fontSize: 13, padding: "8px 10px" }}
          />
        </div>

        {overLimit && (
          <div style={{ ...errorStyle, marginTop: 10 }}>
            Free plan: {remainingSlots} tracker{remainingSlots === 1 ? "" : "s"} available — uncheck one to continue.
          </div>
        )}
        {remainingSlots === 0 && (
          <div style={{ ...errorStyle, marginTop: 10 }}>
            You've reached the free plan's {MAX_TRACKERS}-tracker limit. Archive an existing tracker to add a new one.
          </div>
        )}
        <button
          style={{ ...primaryBtn, marginTop: 14, opacity: selectedTrackerNames.length === 0 || overLimit || remainingSlots === 0 ? 0.5 : 1 }}
          disabled={selectedTrackerNames.length === 0 || overLimit || remainingSlots === 0}
          onClick={addSelectedTrackers}
        >
          Add {selectedTrackerNames.length || ""} tracker{selectedTrackerNames.length === 1 ? "" : "s"}
        </button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <button aria-label="Close" style={iconBtn} onClick={onClose}>
          <X size={20} />
        </button>
        <div style={{ fontSize: 18, fontWeight: 700 }}>Track a symptom</div>
      </div>
      <div style={{ position: "relative", marginBottom: 14 }}>
        <Search size={16} color={inkSoft} style={{ position: "absolute", left: 12, top: 14 }} />
        <input
          placeholder="Search — cough, rash, headache..."
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          style={{ ...inputStyle, paddingLeft: 34 }}
          autoFocus
        />
      </div>
      {templates.map((t) => (
        <button key={t.id} style={templateRow} onClick={() => openTemplate(t.id)}>
          <div style={{ fontSize: 15, fontWeight: 700 }}>{t.label}</div>
          <div style={{ fontSize: 12, color: inkSoft, marginTop: 2 }}>{t.description}</div>
        </button>
      ))}
      {templates.length === 0 && <div style={{ fontSize: 13, color: inkSoft, padding: "10px 4px" }}>No matches — try a different word.</div>}
    </div>
  );
}

function MedicationSection({ meds, medName, setMedName, medDose, setMedDose, onAdd, onDelete, onUpdate, catalogCount, knownMedNames }) {
  const sorted = [...meds].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 6);
  const grouped = groupMedsByDisplayTime(sorted);
  const isNewDistinct = medName.trim() && !knownMedNames.includes(medName.trim().toLowerCase());
  const atCap = isNewDistinct && catalogCount >= MAX_MEDICATIONS;
  const [customTime, setCustomTime] = useState(null); // null = log at "now" (the fast default)
  const [editingMedId, setEditingMedId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editDose, setEditDose] = useState("");
  const [editTime, setEditTime] = useState("");

  function startEdit(m) {
    setEditingMedId(m.id);
    setEditName(m.name);
    setEditDose(m.dose || "");
    setEditTime(isoToLocalInput(m.timestamp));
  }
  function cancelEdit() {
    setEditingMedId(null);
    setEditName("");
    setEditDose("");
    setEditTime("");
  }
  function saveEdit() {
    if (!editName.trim()) return;
    onUpdate(editingMedId, editName.trim(), editDose.trim(), editTime);
    cancelEdit();
  }

  return (
    <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 14, marginTop: 20, marginBottom: 16 }}>
      <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 10 }}>Medications</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <input placeholder="Ibuprofen" value={medName} onChange={(e) => setMedName(e.target.value)} style={{ ...inputStyle, flex: 1.4 }} />
        <input placeholder="200 mg" value={medDose} onChange={(e) => setMedDose(e.target.value)} style={{ ...inputStyle, flex: 1 }} />
      </div>
      {atCap && (
        <div style={{ ...errorStyle, marginBottom: 8 }}>Free plan: 15 medications tracked. Delete an unused one to add a new name.</div>
      )}
      {customTime === null ? (
        <button
          onClick={() => setCustomTime(nowForInput())}
          style={{ background: "none", border: "none", color: blue, fontSize: 12, fontWeight: 600, padding: "0 0 8px", cursor: "pointer", display: "block" }}
        >
          Log for a different time
        </button>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
          <input
            type="datetime-local"
            value={customTime}
            onChange={(e) => setCustomTime(e.target.value)}
            style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, flex: 1 }}
          />
          <button onClick={() => setCustomTime(null)} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>
            Use now
          </button>
        </div>
      )}
      <button
        style={{ ...primaryBtnSmall, opacity: !medName.trim() || atCap ? 0.5 : 1 }}
        disabled={!medName.trim() || atCap}
        onClick={() => { onAdd(customTime); setCustomTime(null); }}
      >
        Add medication
      </button>
      {grouped.length > 0 && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${paperDark}` }}>
          {grouped.map((g) => (
            <div key={g.label + g.items[0].id} style={{ padding: "6px 0" }}>
              <div style={{ color: inkSoft, fontSize: 12, marginBottom: 2 }}>{g.label}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
                {g.items.map((m, i) =>
                  editingMedId === m.id ? (
                    <div key={m.id} style={{ width: "100%", background: paper, border: `1px solid ${border}`, borderRadius: 10, padding: 8, marginTop: 4 }}>
                      <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                        <input value={editName} onChange={(e) => setEditName(e.target.value)} style={{ ...inputStyle, padding: "6px 8px", fontSize: 13, flex: 1.4 }} />
                        <input value={editDose} onChange={(e) => setEditDose(e.target.value)} style={{ ...inputStyle, padding: "6px 8px", fontSize: 13, flex: 1 }} />
                      </div>
                      <input
                        type="datetime-local"
                        value={editTime}
                        onChange={(e) => setEditTime(e.target.value)}
                        style={{ ...inputStyle, padding: "6px 8px", fontSize: 12, width: "100%", marginBottom: 6 }}
                      />
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <button onClick={saveEdit} style={{ ...primaryBtnSmall, padding: "6px 12px", fontSize: 12 }}>Save</button>
                        <button onClick={cancelEdit} style={{ background: "none", border: "none", color: inkSoft, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                        <button
                          onClick={() => { onDelete(m.id); cancelEdit(); }}
                          style={{ background: "none", border: "none", color: red, fontSize: 12, cursor: "pointer", marginLeft: "auto" }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ) : (
                    <span key={m.id} style={{ display: "inline-flex", alignItems: "center", gap: 2, fontSize: 14 }}>
                      {i > 0 && <span style={{ color: inkSoft, marginRight: 2 }}>,</span>}
                      <button onClick={() => startEdit(m)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 14, color: ink, textDecoration: "underline", textDecorationColor: border }}>
                        {medLabel(m)}
                      </button>
                    </span>
                  )
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ReportSection({ show, setShow, text, onCopy, copied }) {
  return (
    <div style={{ background: card, border: `1px solid ${border}`, borderRadius: 16, padding: 14 }}>
      <button style={{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", cursor: "pointer", padding: 0, fontSize: 16, fontWeight: 700, color: ink }} onClick={() => setShow((s) => !s)}>
        <FileText size={18} /> Report (last 72 hours)
      </button>
      {show && (
        <div style={{ marginTop: 12 }}>
          <pre style={{ whiteSpace: "pre-wrap", fontFamily: "monospace", fontSize: 12, background: paper, border: `1px solid ${border}`, borderRadius: 10, padding: 10 }}>
            {text}
          </pre>
          <button style={primaryBtnSmall} onClick={onCopy}>
            <Copy size={14} style={{ marginRight: 6 }} /> {copied ? "Copied" : "Copy report"}
          </button>
        </div>
      )}
    </div>
  );
}

function GlobalStyle() {
  return (
    <style>{`
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      button:focus-visible, input:focus-visible { outline: 3px solid ${blue}; outline-offset: 2px; }
      button:active { opacity: 0.85; }
      @media (prefers-reduced-motion: no-preference) { /* intentionally no transitions anywhere */ }
    `}</style>
  );
}

// ---------- Shared inline styles (kept static — no animated properties) ----------
const inputStyle = {
  width: "100%", border: `1px solid ${border}`, borderRadius: 10, padding: "12px 12px",
  fontSize: 16, background: paper, color: ink,
};
const primaryBtn = {
  width: "100%", background: ink, color: paper, border: "none", borderRadius: 12,
  padding: "14px 0", fontSize: 16, fontWeight: 700, cursor: "pointer",
};
const primaryBtnSmall = {
  background: ink, color: paper, border: "none", borderRadius: 10,
  padding: "10px 16px", fontSize: 14, fontWeight: 700, cursor: "pointer",
};
const bigTrackBtn = {
  display: "flex", alignItems: "center", justifyContent: "center",
  background: ink, color: paper, border: "none", borderRadius: 16,
  padding: "22px 32px", fontSize: 19, fontWeight: 700, cursor: "pointer",
};
const secondaryTrackBtn = {
  width: "100%", display: "flex", alignItems: "center", justifyContent: "center",
  background: paperDark, color: ink, border: `1px solid ${border}`, borderRadius: 12,
  padding: "14px 0", fontSize: 15, fontWeight: 700, cursor: "pointer", marginBottom: 8,
};
const scaleBtn = {
  width: 38, height: 38, borderRadius: 8, border: `1px solid ${border}`,
  background: paper, color: ink, fontWeight: 700, fontSize: 14, cursor: "pointer",
};
const iconBtn = {
  background: "none", border: "none", cursor: "pointer", padding: 6, display: "flex", alignItems: "center",
};
const linkBtn = {
  width: "100%", background: "none", border: "none", color: blue, fontSize: 13, fontWeight: 600,
  cursor: "pointer", padding: "10px 0", textAlign: "center",
};
const linkBtnSmall = {
  background: "none", border: `1px solid ${border}`, color: inkSoft, fontSize: 12, fontWeight: 600,
  cursor: "pointer", padding: "6px 10px", borderRadius: 8,
};
const toggleBtn = {
  flex: 1, padding: "9px 0", borderRadius: 9, border: `1px solid ${border}`,
  background: paper, color: ink, fontWeight: 700, fontSize: 13, cursor: "pointer",
};
const toggleBtnActive = {
  background: ink, color: paper, borderColor: ink,
};
const templateRow = {
  width: "100%", textAlign: "left", background: card, border: `1px solid ${border}`,
  borderRadius: 12, padding: "12px 14px", marginBottom: 8, cursor: "pointer",
};
const errorStyle = {
  background: redSoft, color: red, border: `1px solid ${red}`, borderRadius: 10,
  padding: "10px 12px", fontSize: 13, marginBottom: 10,
};

ReactDOM.createRoot(document.getElementById("root")).render(<CareLog />);
</script>
